// =========================================================
// ゲーム画面全体のサイズ調整
// =========================================================

const GAME_WIDTH = 1280;
const GAME_HEIGHT = 720;

function resizeGameScreen() {

  const viewportWidth =
    window.innerWidth;

  const viewportHeight =
    window.innerHeight;


  const scaleX =
    viewportWidth / GAME_WIDTH;

  const scaleY =
    viewportHeight / GAME_HEIGHT;


  // 縦横とも画面内に収まる最大倍率
  const scale =
    Math.min(
      scaleX,
      scaleY
    );


  gameStage.style.transform =
    `translate(-50%, -50%) scale(${scale})`;
}



// =========================================================
// タブレット本体の解放状態
// =========================================================

let isTabletUnlocked = false;



// =========================================================
// TABLETボタンの表示状態を更新
// =========================================================

function updateTabletButtonVisibility() {

  const buttonContainer =
    document.getElementById(
      "tablet-trigger-container"
    );

  if (!buttonContainer) {
    return;
  }

const hasTablet = isTabletUnlocked;


// 通常会話画面かどうか
const isDialogueScreen =
  document.getElementById("game-screen") !== null;

// 調査画面かどうか
const isInvestigationScreen =
  document.getElementById("investigation-screen") !== null &&
  isInvestigationMode;


// タブレット入手後のみ表示する
// 通常会話中・調査中の両方に対応
const shouldShowTablet =
  hasTablet &&
  (isDialogueScreen || isInvestigationScreen);

// 表示・非表示を実際のボタンに反映
buttonContainer.classList.toggle(
  "active",
  shouldShowTablet
);

}




// =========================================================
// タブレット：NEW通知管理
// =========================================================

// 未確認の更新があるアプリ
const tabletNewNotifications = new Set();

// NEW通知を追加
function addTabletNewNotification(appId) {

  tabletNewNotifications.add(appId);

  updateTabletNewBadge();

}

// NEW通知を既読にする
function clearTabletNewNotification(appId) {

  tabletNewNotifications.delete(appId);

  updateTabletNewBadge();

}

// TABLETボタンの通知を更新
function updateTabletNewBadge() {

  const button =
    document.getElementById("tablet-toggle-btn");

  if (!button) return;

  button.classList.add("tablet-new-anchor");

  // 以前の通知を削除
  button.querySelectorAll(".tablet-new-dot")
    .forEach(el => el.remove());

  // 未確認の更新がなければ終了
  if (tabletNewNotifications.size === 0) return;

  const dot = document.createElement("span");

  dot.className = "tablet-new-dot";
  dot.setAttribute("aria-hidden", "true");

  button.appendChild(dot);
}

// アプリのNEWマークを更新
function updateTabletAppNewBadges() {

  document.querySelectorAll("[data-tablet-app-id]")
    .forEach(button => {

      button.classList.add("tablet-new-anchor");

      button.querySelectorAll(".tablet-new-badge")
        .forEach(el => el.remove());

      const appId = button.dataset.tabletAppId;

      if (!tabletNewNotifications.has(appId)) {
        return;
      }

      const badge = document.createElement("span");

      badge.className = "tablet-new-badge";
      badge.textContent = "NEW";
      badge.setAttribute("aria-hidden", "true");

      button.appendChild(badge);

    });

}

// 通知状態を初期化
function resetTabletNewNotifications() {

  tabletNewNotifications.clear();

  updateTabletNewBadge();

}




// =========================================================
// タブレット・スポットライト演出

// 現在の強調状態
let isTabletSpotlightActive = false;

// 強調状態を切り替える
function setTabletSpotlight(enabled) {

  isTabletSpotlightActive = enabled === true;

  // スポットライト開始時はAUTO・SKIPを停止

    stopAutoMode();
    stopSkipMode();

// =========================================================
// 画面演出時間

const FADE_TIME = 400;
const NAME_SCENE_WAIT = 600;
const GAME_START_WAIT = 900;
const CHAPTER_START_WAIT = 1600;


  // =========================================================
  // セーブスロット数
  // =========================================================

  const SAVE_PAGE_COUNT = 5;   // SLOT 1～5
  const SLOTS_PER_PAGE = 6;    // 各SLOT内の保存枠数


  // =========================================================
  // 会話履歴
  // =========================================================

  let dialogueHistory = [];


  // =========================================================
  // 既読データ
  // =========================================================

  let readFlags = [];

  try {

    const savedReadFlags =
      localStorage.getItem(
        'floriography_read_flags'
      );

    readFlags =
      savedReadFlags
        ? JSON.parse(savedReadFlags)

    console.error(

  // =========================================================

   // AUTOモード
let isAutoMode = false;
let autoTimerId = null;

// AUTO待機時間の設定
const autoBaseWait = 350;      // 最低待機時間
const autoPerCharWait = 25;    // 1文字あたりの追加時間
const autoMaxWait = 1800;      // 長文でも最大〇秒

  // =========================================================
  // テキスト表示速度

} catch (e) {

// =========================================================

const DEFAULT_INVESTIGATION_FLAGS = {

    false,

  backChecked:
    false,

  shionDeskChecked:
    false,

  studentBookFound:
    false,

    false,

　parkBenchChecked: false,
　parkFlowerbedChecked: false,

// =========================================================
// 現在の持ち物

  ...DEFAULT_INVENTORY
};


// =========================================================
// 持ち物を取得
// =========================================================

function addItem(
  itemId
) {

  if (
    !(itemId in inventory)
  ) {

    console.warn(
      "存在しない持ち物です:",
      itemId
    );

    return;
  }


  inventory[
    itemId
  ] = true;
}


// =========================================================
// 持ち物を失う
// =========================================================

function removeItem(
  itemId
) {

  if (
    !(itemId in inventory)
  ) {

    console.warn(
      "存在しない持ち物です:",
      itemId
    );

    return;
  }


  inventory[
    itemId
  ] = false;
}


// =========================================================
// 持ち物所持判定
// =========================================================

function hasItem(
  itemId
) {

  return (
    inventory[
      itemId
    ] === true
  );
}



// =========================================================
// 持ち物一覧表示
// =========================================================

function showInventory() {

  const overlay =
    document.getElementById("inventory-overlay");

  const content =
    document.getElementById("inventory-content");

  const items = Object.entries(ITEM_DATA)
    .filter(([itemId]) => hasItem(itemId));

  content.innerHTML = "";

  if (items.length === 0) {

    content.textContent =
      "現在、持ち物はありません。";

  } else {

    const list =
      document.createElement("div");

    list.className = "inventory-list";

    items.forEach(([itemId, itemData]) => {

      const button =
        document.createElement("button");

      button.type = "button";
      button.className = "inventory-item-btn";
      button.textContent = itemData.name;

      button.addEventListener("click", () => {
        showItemDetail(itemId);
      });

      list.appendChild(button);
    });

    content.appendChild(list);
  }

  overlay.classList.add("active");
}


// =========================================================
// 持ち物詳細表示
// =========================================================

function showItemDetail(itemId) {

  if (!hasItem(itemId)) {
    return;
  }

  const item = ITEM_DATA[itemId];

  if (!item) {
    return;
  }

  const content =
    document.getElementById("inventory-content");

  content.innerHTML = "";

  const detail =
    document.createElement("div");

  detail.className = "inventory-detail";

  const name =
    document.createElement("div");

  name.className = "inventory-detail-name";
  name.textContent = item.name;

  const description =
    document.createElement("div");

  description.className =
    "inventory-detail-description";

  description.textContent = item.description;

  const backButton =
    document.createElement("button");

  backButton.type = "button";
  backButton.className = "inventory-back-btn";
  backButton.textContent = "← 一覧に戻る";

  backButton.addEventListener("click", () => {
    showInventory();
  });

detail.append(
  name,
  description,
  backButton
);

  content.appendChild(detail);
}

// =========================================================
// キャラクターパラメータ初期値
// =========================================================

const DEFAULT_CHARACTER_PARAMS = {

  kyoya: {
    affection: 60,
    possessiveness: 35
  },

  kezi: {
    affection: 20,
    empathy: 20
  },

  aoi: {
    affection: 15,
    trust: 25
  },

  shion: {
    affection: 5,
    attachment: 30
  },

  anna: {
    affection: 45,
    honesty: 20
  },

  rento: {
    affection: 30,
    understanding: 25
  }

};


// =========================================================
// 現在のキャラクターパラメータ
// =========================================================

const characterParams = {

  kyoya: {
    ...DEFAULT_CHARACTER_PARAMS.kyoya
  },

  kezi: {
    ...DEFAULT_CHARACTER_PARAMS.kezi
  },

  aoi: {
    ...DEFAULT_CHARACTER_PARAMS.aoi
  },

  shion: {
    ...DEFAULT_CHARACTER_PARAMS.shion
  },

  anna: {
    ...DEFAULT_CHARACTER_PARAMS.anna
  },

  rento: {
    ...DEFAULT_CHARACTER_PARAMS.rento
  }

};


// =========================================================
// キャラクターパラメータ増減
// 0～100の範囲に収める
// =========================================================

function addCharacterParam(
  characterId,
  paramName,
  amount
) {

  const character =
    characterParams[
      characterId
    ];


  if (!character) {

    console.warn(
      "存在しないキャラクターです:",
      characterId
    );

    return;
  }


  if (
    !(paramName in character)
  ) {

    console.warn(
      "存在しないパラメータです:",
      characterId,
      paramName
    );

    return;
  }


  const newValue =
    character[
      paramName
    ] + amount;


  character[
    paramName
  ] =
    Math.max(
      0,
      Math.min(
        100,
        newValue
      )
    );
}



// =========================================================
// キャラクターパラメータ初期化
// =========================================================

function resetCharacterParams() {

  Object.keys(
    DEFAULT_CHARACTER_PARAMS
  ).forEach(
    characterId => {

      characterParams[
        characterId
      ] = {
        ...DEFAULT_CHARACTER_PARAMS[
          characterId
        ]
      };

    }
  );
}



// =========================================================
// 選択肢のパラメータ変化をまとめて適用
// =========================================================

function applyChoiceEffects(
  effects
) {

  if (
    !Array.isArray(
      effects
    )
  ) {

    return;
  }


  effects.forEach(
    effect => {

      if (
        !effect ||
        !effect.character ||
        !effect.param
      ) {

        return;
      }


      addCharacterParam(
        effect.character,
        effect.param,
        effect.amount ?? 0
      );

    }
  );
}



// =========================================================
// シナリオIDから現在位置を移動
// =========================================================

function jumpToScenarioId(
  targetId
) {

  const currentScenario =
    getCurrentScenario();


  const targetIndex =
    currentScenario.findIndex(
      item =>
        item.id ===
        targetId
    );


  if (
    targetIndex === -1
  ) {

    console.warn(
      "移動先のシナリオIDが見つかりません:",
      targetId
    );

    return false;
  }


  currentStep =
    targetIndex;


  updateDialogue();


  return true;
}



// =========================================================
// 選択肢表示
// =========================================================

function showChoice(
  data
) {

  stopSkipMode();
  stopAutoMode();
  stopTextTimer();


  const gameScreen =
    document.getElementById(
      'game-screen'
    );


  if (!gameScreen) {

    console.warn(
      "選択肢を表示する画面が見つかりません。"
    );

    return;
  }


  const oldChoiceBox =
    document.getElementById(
      'choice-box'
    );


  if (oldChoiceBox) {

    oldChoiceBox.remove();
  }


  const choiceBox =
    document.createElement(
      'div'
    );


  choiceBox.id =
    'choice-box';

  choiceBox.className =
    'choice-box';


  const choices =
    Array.isArray(
      data.choices
    )
      ? data.choices
      : [];


  choices.forEach(
    choice => {

      const button =
        document.createElement(
          'button'
        );


      button.type =
        'button';

      button.className =
        'choice-btn';

      button.textContent =
        choice.text ?? "選択肢";


      button.addEventListener(
        'click',
        () => {

          applyChoiceEffects(
            choice.effects
          );


          choiceBox.remove();


          if (
            choice.nextId
          ) {

            jumpToScenarioId(
              choice.nextId
            );

          } else {

            currentStep++;

            updateDialogue();
          }

        }
      );


      choiceBox.appendChild(
        button
      );

    }
  );


  gameScreen.appendChild(
    choiceBox
  );
}


// =========================================================
// キャラクター別エンディング判定基準
// =========================================================

const CHARACTER_ENDING_THRESHOLDS = {

  kyoya: {
    affection: 70,
    possessiveness: 60
  },

  kezi: {
    affection: 65,
    empathy: 70
  },

  aoi: {
    affection: 75,
    trust: 65
  },

  shion: {
    affection: 60,
    attachment: 75
  },

  anna: {
    affection: 70,
    honesty: 65
  },

  rento: {
    affection: 65,
    understanding: 70
  }

};


// =========================================================
// キャラクター別 B / C エンディング判定
// =========================================================

function getCharacterEndingType(
  characterId
) {

  const params =
    characterParams[
      characterId
    ];


  const threshold =
    CHARACTER_ENDING_THRESHOLDS[
      characterId
    ];


  if (
    !params ||
    !threshold
  ) {

    console.warn(
      "エンディング判定情報がありません:",
      characterId
    );

    return null;
  }


  const paramNames =
    Object.keys(
      threshold
    );


  const allPassed =
    paramNames.every(
      paramName => {

        return (
          params[paramName] >=
          threshold[paramName]
        );

      }
    );


  return allPassed
    ? "C"
    : "B";
}

// 現在のフラグを反映したページ本文を取得する
function getEbookPageText(bookId, pageIndex) {
  const pageData = EBOOK_DATA[bookId]?.pages?.[pageIndex];

  if (pageData === undefined) return "";

  let rawText = "";

  if (typeof pageData === "string") {
    rawText = pageData;

  } else if (typeof pageData?.flag === "string") {
    rawText = investigationFlags[pageData.flag] === true
      ? pageData.after ?? ""
      : pageData.before ?? "";

  } else {
    rawText = pageData?.text ?? "";
  }

  return rawText.replace(
    /\{\{stamp:([a-zA-Z0-9_]+)\}\}/g,
    (match, flagName) =>
      investigationFlags[flagName] === true
        ? "取得済み"
        : "未取得"
  );
}

  const book = EBOOK_DATA[bookId];

  if (!book || !Array.isArray(book.pages)) {
    return false;
  }

  // 現在のページより後ろを調べる
  for (
    let i = currentPageIndex + 1;
    i < book.pages.length;
    i++
  ) {

    if (!isEbookPageRead(bookId, i)) {
      return true;
    }

  }

  return false;
}

// 一度読み込んだBGMを保存
const bgmBufferCache =
  new Map();

const bgmLoadingPromises =
  new Map();

// =========================================================
// AudioContextを準備
// =========================================================

function getAudioContext() {

  if (!audioContext) {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    audioContext =
      new AudioContextClass();


    bgmGainNode =
      audioContext.createGain();

bgmGainNode.gain.value =
  bgmVolume;

    bgmGainNode.connect(
      audioContext.destination
    );
  }

  return audioContext;
}


// =========================================================
// BGMファイルをメモリへ読み込む
// =========================================================

async function loadBgmBuffer(fileName) {

  // すでに読み込み済み
  if (
    bgmBufferCache.has(
      fileName
    )
  ) {

    return bgmBufferCache.get(
      fileName
    );
  }


  // 現在読み込み中なら、その処理を待つ
  if (
    bgmLoadingPromises.has(
      fileName
    )
  ) {

    return bgmLoadingPromises.get(
      fileName
    );
  }


  const context =
    getAudioContext();


  const loadingPromise =
    fetch(
      `audio/${fileName}`
    )
      .then(
        response => {

          if (!response.ok) {

            throw new Error(
              `BGMファイルを取得できませんでした: ${fileName}`
            );
          }

          return response.arrayBuffer();
        }
      )
      .then(
        arrayBuffer =>
          context.decodeAudioData(
            arrayBuffer
          )
      )
      .then(
        audioBuffer => {

          bgmBufferCache.set(
            fileName,
            audioBuffer
          );

          bgmLoadingPromises.delete(
            fileName
          );

          return audioBuffer;
        }
      )
      .catch(
        error => {

          bgmLoadingPromises.delete(
            fileName
          );

          throw error;
        }
      );


  bgmLoadingPromises.set(
    fileName,
    loadingPromise
  );


  return loadingPromise;
}

// =========================================================
// ゲームデータの整合性チェック
// =========================================================

function checkGameData() {

  const errors = [];
  const warnings = [];

  // -------------------------------------------------------
  // ① シナリオから参照するデータをチェック
  // -------------------------------------------------------

  Object.entries(sceneInfo).forEach(([sceneId, scene]) => {

    scene.scenario.forEach(data => {

      if (
        data.type === "investigation" &&
        !investigationData[data.investigationId]
      ) {
        errors.push(
          `調査データがありません: ${data.investigationId}`
        );
      }

      if (
        data.type === "unlockEbook" &&
        !EBOOK_DATA[data.bookId]
      ) {
        errors.push(
          `電子書籍がありません: ${data.bookId}`
        );
      }

      if (
        data.type === "unlockCharacter" &&
        !CHARACTER_PROFILE_DATA[data.characterId]
      ) {
        errors.push(
          `人物データがありません: ${data.characterId}`
        );
      }

    });

  });

  // -------------------------------------------------------
  // ② 調査データをチェック
  // -------------------------------------------------------

  Object.entries(investigationData).forEach(
    ([investigationId, investigation]) => {

      if (
        investigation.completionFlag &&
        !(investigation.completionFlag in DEFAULT_INVESTIGATION_FLAGS)
      ) {
        errors.push(
          `未登録の調査終了フラグ: ${investigationId}`
        );
      }

      if (
        !investigation.targets ||
        typeof investigation.targets !== "object"
      ) {
        errors.push(
          `調査対象の設定がありません: ${investigationId}`
        );
        return;
      }

      Object.entries(investigation.targets).forEach(
        ([targetId, target]) => {

          if (
            !target.flag ||
            !(target.flag in DEFAULT_INVESTIGATION_FLAGS)
          ) {
            errors.push(
              `未登録の調査フラグ: ${investigationId} / ${targetId}`
            );
          }

          if (
            !Array.isArray(target.result)
          ) {
            errors.push(
              `調査結果の会話データが不正です: ${investigationId} / ${targetId}`
            );
          }

        }
      );

      // 会話相手のデータも確認
      if (investigation.talks) {

        Object.entries(investigation.talks).forEach(
          ([talkId, talk]) => {

            if (!Array.isArray(talk.result)) {
              errors.push(
                `人物との会話データが不正です: ${investigationId} / ${talkId}`
              );
            }

          }
        );

      }

    }
  );

  // -------------------------------------------------------
  // ③ 電子書籍データをチェック
  // -------------------------------------------------------

  Object.entries(EBOOK_DATA).forEach(([bookId, book]) => {

    if (!Array.isArray(book.pages)) {
      errors.push(
        `電子書籍のページ設定が不正です: ${bookId}`
      );
      return;
    }

    book.pages.forEach((page, index) => {

      const pageNumber = index + 1;

      if (typeof page === "string") {
        return;
      }

      if (!page || typeof page !== "object") {
        errors.push(
          `不正なページデータ: ${bookId} / ${pageNumber}ページ`
        );
        return;
      }

      // 取得前・取得後で内容が変わるページ
      if (page.flag) {

        if (!(page.flag in DEFAULT_INVESTIGATION_FLAGS)) {
          errors.push(
            `電子書籍の未登録フラグ: ${bookId} / ${page.flag}`
          );
        }

        if (
          typeof page.before !== "string" ||
          typeof page.after !== "string"
        ) {
          errors.push(
            `beforeまたはafterがありません: ${bookId} / ${pageNumber}ページ`
          );
        }

      } else if (typeof page.text !== "string") {

        errors.push(
          `電子書籍の本文がありません: ${bookId} / ${pageNumber}ページ`
        );

      }

    });

  });

  // -------------------------------------------------------
  // ④ 結果をConsoleへ表示
  // -------------------------------------------------------

  if (errors.length === 0 && warnings.length === 0) {

    console.log(
      "✅ ゲームデータ整合性チェック：問題なし"
    );

  } else {

    errors.forEach(message => {
      console.error("❌ " + message);
    });

    warnings.forEach(message => {
      console.warn("⚠️ " + message);
    });

  }

}



// =========================================================
// シナリオIDチェック
// =========================================================

function checkScenarioIds() {

  const usedIds =
    new Map();


  const duplicateIds =
    [];


  const missingIds =
    [];


  Object.entries(
    sceneInfo
  ).forEach(
    ([sceneId, sceneData]) => {

      const scenario =
        sceneData.scenario;


      scenario.forEach(
        (item, index) => {

          // ---------------------------------------------------
          // ID未設定チェック
          // ---------------------------------------------------

          if (
            !item.id
          ) {

            missingIds.push({
              sceneId,
              index
            });

            return;
          }


          // ---------------------------------------------------
          // ID重複チェック
          // ---------------------------------------------------

          if (
            usedIds.has(
              item.id
            )
          ) {

            duplicateIds.push({
              id:
                item.id,

              first:
                usedIds.get(
                  item.id
                ),

              second: {
                sceneId,
                index
              }
            });

          } else {

            usedIds.set(
              item.id,
              {
                sceneId,
                index
              }
            );
          }

        }
      );

    }
  );


  // -------------------------------------------------------
  // 重複IDを表示
  // -------------------------------------------------------

  if (
    duplicateIds.length > 0
  ) {

    console.error(
      "シナリオIDの重複があります。",
      duplicateIds
    );

  } else {

    console.log(
      "シナリオID重複チェック：問題なし"
    );
  }


  // -------------------------------------------------------
  // ID未設定を表示
  // -------------------------------------------------------

  if (
    missingIds.length > 0
  ) {

    console.warn(
      "ID未設定のシナリオがあります。",
      missingIds
    );
  }
}

// =========================================================
// BGM再生
// =========================================================

async function playBgm(fileName) {

  // 同じ曲がすでに再生中なら何もしない
  if (
    currentBgm === fileName &&
    currentBgmSource
  ) {

    return true;
  }


  const actionId =
    ++bgmActionId;


  try {

    const context =
      getAudioContext();


    // 必要ならAudioContextを再開
    if (
      context.state ===
      "suspended"
    ) {

      await context.resume();
    }


    // 音源を読み込み
    const buffer =
      await loadBgmBuffer(
        fileName
      );


    // 読み込み中に別のBGM操作が行われていたら中止
    if (
      actionId !==
      bgmActionId
    ) {

      return false;
    }


    // 現在のBGMを停止
    if (currentBgmSource) {

      try {

        currentBgmSource.stop();

      } catch (error) {

        // すでに停止済みなら無視
      }


      currentBgmSource.disconnect();

      currentBgmSource = null;
    }


    // 新しい再生ノードを作る
    const source =
      context.createBufferSource();


    source.buffer =
      buffer;


    // シームレスループ
    source.loop =
      true;


    source.connect(
      bgmGainNode
    );


    currentBgmSource =
      source;

    currentBgm =
      fileName;


    // 曲頭から再生
    source.start(0);


    return true;


  } catch (error) {

    console.warn(
      "BGMの再生に失敗しました:",
      error
    );

    return false;
  }
}


// =========================================================
// BGM停止
// =========================================================

function stopBgm() {

  // 読み込み途中のBGMも無効化
  bgmActionId++;


  if (currentBgmSource) {

    try {

      currentBgmSource.stop();

    } catch (error) {

      // すでに停止済みなら無視
    }


    currentBgmSource.disconnect();

    currentBgmSource =
      null;
  }


  currentBgm =
    null;
}



// =========================================================
// BGMをフェードアウトしてリセット
// =========================================================

function fadeOutAndResetBgm(
  duration = 600
) {

  return new Promise(
    resolve => {

      // BGMが流れていなければ何もしない
      if (
        !currentBgmSource ||
        !bgmGainNode ||
        !audioContext
      ) {

        resolve();

        return;
      }


      const now =
        audioContext.currentTime;


      const currentVolume =
        bgmGainNode.gain.value;


      // 以前の音量変化予約を解除
      bgmGainNode.gain
        .cancelScheduledValues(
          now
        );


      // 現在音量から開始
      bgmGainNode.gain
        .setValueAtTime(
          currentVolume,
          now
        );


      // durationミリ秒かけて0へ
      bgmGainNode.gain
        .linearRampToValueAtTime(
          0,
          now + duration / 1000
        );


      setTimeout(
        () => {

          // BGMそのものを停止
          stopBgm();


          // 次にBGMを再生するときのため、
          // Configで設定された音量へ戻す
          if (bgmGainNode) {

            bgmGainNode.gain
              .cancelScheduledValues(
                audioContext.currentTime
              );


            bgmGainNode.gain.value =
              bgmVolume;
          }


          resolve();

        },

        duration
      );

    }
  );
}

function preloadBackground(imageName) {

}

    );

// -------------------------------------------------------

await Promise.all([

  ),

  bgmResetPromise
]);

  );

// =========================================================
// 現在位置までのシナリオから
// 本来のシーンBGMを取得
// =========================================================

function getSceneBgmFromScenario(
  scenario,
  step
) {

  let bgm =
    null;


  for (
    let i = 0;
    i <= step &&
    i < scenario.length;
    i++
  ) {

    const data =
      scenario[i];


    if (
      data.type ===
      "bgm"
    ) {

      bgm =
        data.file;
    }


    if (
      data.type ===
      "bgmStop"
    ) {

      bgm =
        null;
    }


    if (
      data.type ===
        "backgroundFade" &&
      data.resetBgm ===
        true
    ) {

      bgm =
        null;
    }
  }


  return bgm;
}

// =========================================================
// 移動先の解放状態
// =========================================================

const locationUnlocked = {};

// 新しいゲーム用の初期化
function resetLocationUnlocked() {

  Object.keys(locationUnlocked).forEach(id => {
    delete locationUnlocked[id];
  });

  Object.keys(LOCATION_DATA).forEach(id => {
    locationUnlocked[id] = false;
  });

}

// 移動先を解放
function unlockLocation(locationId) {

  if (!LOCATION_DATA[locationId]) {
    console.warn("未登録の移動先:", locationId);
    return;
  }

  locationUnlocked[locationId] = true;

}

// 移動可能か判定
function isLocationUnlocked(locationId) {

  const destination = LOCATION_DATA[locationId];

  if (!destination) return false;

  // 解放されていなければ移動不可
  if (locationUnlocked[locationId] !== true) {
    return false;
  }

  // 現在地に対応する場所を調べる
  const currentLocation = Object.values(LOCATION_DATA)
    .find(location =>
      location.investigationId === currentInvestigationId
    );

  // 学校など、移動エリアに属さない場所からは移動不可
  if (!currentLocation) return false;

  // 同じエリア内のみ移動可能
  return destination.area === currentLocation.area;

}

// =========================================================

  const location = LOCATION_DATA[locationId];

  if (!location) return;

  if (!isLocationUnlocked(locationId)) return;

  if (!investigationData[location.investigationId]) {
    console.warn(
      "移動先の調査データがありません:",
      location.investigationId
    );
    return;
  }

  // 現在地と同じなら何もしない
  if (currentInvestigationId === location.investigationId) {
    return;
  }

  // 背景を変更
  changeBackground(location.background);

  // 場所ごとのBGMに切り替える
  sceneBgm = location.bgm ?? null;

  if (sceneBgm) {
    playBgm(sceneBgm);
  } else {
    stopBgm();
  }

  // メインシナリオのcurrentStepは変更しない
  // 選択した場所の調査画面だけを表示する
  renderInvestigationScreen(location.investigationId);

}

        oldOverlay.remove();
      }


      const overlay =
        document.createElement(
          'div'
        );


      overlay.className =
        'tablet-loading-overlay';


      overlay.innerHTML = `
        <div
          class="tablet-loading-spinner"
        ></div>
      `;


      screen.appendChild(
        overlay
      );


      setTimeout(
        () => {

          overlay.remove();


          isTabletStarting =
            false;


          resolve(true);

        },

        300
      );

    }
  );
}

// =========================================================
// 電子書籍：ページ表示
// =========================================================

function showEbookPage(bookId, pageIndex) {

if (ebookUnlocked[bookId] !== true) {
  return;
}

  const book = EBOOK_DATA[bookId];

  if (!book || !Array.isArray(book.pages)) {
    return;
  }

  const totalPages = book.pages.length;

  if (totalPages === 0) {
    return;
  }

  // ページ番号を範囲内に収める
  pageIndex = Math.max(
    0,
    Math.min(pageIndex, totalPages - 1)
  );

  const tablet =
    document.querySelector(".tablet-home-panel");

  if (!tablet) {
    return;
  }

  const title =
    tablet.querySelector(".tablet-home-title");

  const subtitle =
    tablet.querySelector(".tablet-home-text");

  const menu =
    tablet.querySelector(".tablet-function-menu");

  if (!title || !subtitle || !menu) {
    return;
  }

  title.textContent = book.title;

  subtitle.textContent =
    `${pageIndex + 1} / ${totalPages} ページ`;

  menu.innerHTML = "";

  menu.classList.remove("character-view");
  menu.classList.add("ebook-view");

// -------------------------------------------------------
// 電子書籍本文・スマートハイライト表示
// -------------------------------------------------------

const page =
  document.createElement("div");

page.className = "ebook-page";



// =========================================================
// 電子書籍：ページの状態に応じて文章を選択
// =========================================================

// ページデータを取得
const pageData = book.pages[pageIndex];

let rawPageText = "";

// 従来の文字列形式
if (typeof pageData === "string") {

  rawPageText = pageData;

// フラグによる切り替え形式
} else if (
  pageData &&
  typeof pageData.flag === "string"
) {

  const acquired =
    investigationFlags[pageData.flag] === true;

  rawPageText = acquired
    ? pageData.after ?? ""
    : pageData.before ?? "";

// 従来のオブジェクト形式
} else {

  rawPageText = pageData?.text ?? "";

}

// スタンプ獲得状況の置換も引き続き利用
const pageText = rawPageText.replace(
  /\{\{stamp:([a-zA-Z0-9_]+)\}\}/g,
  (match, flagName) => {
    return investigationFlags[flagName] === true
      ? "取得済み"
      : "未取得";
  }
);



// ハイライト情報を取得
const highlights =
  typeof pageData === "object" &&
  pageData !== null &&
  Array.isArray(pageData.highlights)
    ? pageData.highlights
    : [];

// ハイライト付き本文を生成
renderEbookHighlights(
  page,
  pageText,
  highlights
);

menu.appendChild(page);




// =========================================================
// 表示したページを既読として記録
// =========================================================

markEbookPageAsRead(bookId, pageIndex);

// 未読状況に応じてNEW通知を更新
syncEbookNewNotification();



  // -------------------------------------------------------
  // ページ操作ボタン
  // -------------------------------------------------------

  const controls =
    document.createElement("div");

  controls.className = "ebook-controls";

  // 前のページ
  const prevButton =
    document.createElement("button");

  prevButton.type = "button";
  prevButton.className = "ebook-page-btn";
  prevButton.textContent = "← 前のページ";

  prevButton.disabled = pageIndex === 0;

  prevButton.addEventListener("click", () => {
    showEbookPage(bookId, pageIndex - 1);
  });

  // 次のページ
  const nextButton =
    document.createElement("button");

  nextButton.type = "button";
  nextButton.className = "ebook-page-btn";
  nextButton.textContent = "次のページ →";

  nextButton.disabled =
    pageIndex === totalPages - 1;


// -------------------------------------------------------
// この先に未読ページがあれば「次へ」に赤い丸を表示
// -------------------------------------------------------

if (
  !nextButton.disabled &&
  hasUnreadEbookPagesAhead(bookId, pageIndex)
) {

  nextButton.classList.add("ebook-next-new-anchor");

  const newDot = document.createElement("span");

  newDot.className = "ebook-next-new-dot";
  newDot.setAttribute("aria-hidden", "true");

  nextButton.appendChild(newDot);

}


  nextButton.addEventListener("click", () => {
    showEbookPage(bookId, pageIndex + 1);
  });

  controls.append(
    prevButton,
    nextButton
  );

  menu.appendChild(controls);

  // -------------------------------------------------------
  // 文書一覧へ戻る
  // -------------------------------------------------------

  const backButton =
    document.createElement("button");

  backButton.type = "button";
  backButton.className = "ebook-back-btn";

  backButton.textContent = "← 文書一覧へ戻る";

  backButton.addEventListener("click", () => {
    showEbookList();
  });

  menu.appendChild(backButton);

// =========================================================
// 電子書籍：スマートハイライト生成
// =========================================================

function renderEbookHighlights(
  container,
  text,
  highlights
) {

  container.innerHTML = "";

  // 有効なハイライトだけを抽出
  const targets = highlights
    .filter(item =>
      item &&
      typeof item.phrase === "string" &&
      item.phrase.length > 0
    );

  // 本文中のハイライト位置を取得
  const matches = [];

  targets.forEach(item => {

    const index = text.indexOf(item.phrase);

    if (index === -1) {
      console.warn(
        "ハイライト対象が本文にありません:",
        item.phrase
      );
      return;
    }

    matches.push({
      start: index,
      end: index + item.phrase.length,
      data: item
    });

  });

  // 本文に出現する順番に並べる
  matches.sort((a, b) => a.start - b.start);

  let position = 0;

  matches.forEach(match => {

    // ほかのハイライトと重なっている場合は無視
    if (match.start < position) {
      console.warn(
        "ハイライト範囲が重複しています:",
        match.data.phrase
      );
      return;
    }

    // ハイライト前の通常文章
    container.appendChild(
      document.createTextNode(
        text.slice(position, match.start)
      )
    );

    // クリック可能なハイライト
    const button =
      document.createElement("button");

    button.type = "button";
    button.className = "ebook-highlight";

    button.textContent =
      text.slice(match.start, match.end);

    button.addEventListener("click", event => {

      event.stopPropagation();

      showEbookAnalysis(match.data);

    });

    container.appendChild(button);

    position = match.end;

  });

  // 最後に残った通常文章
  container.appendChild(
    document.createTextNode(
      text.slice(position)
    )
  );

}

  // ヘッダー
  const header =

    "talks",

    console.warn("不正な調査画面:", view);

  investigationReturnView = view;
}

// =========================================================

// =========================================================


function clearInvestigationView(menuMode = "keep") {

  const screen =
    document.getElementById("investigation-screen");

  if (!screen) return null;

  // 調査中の文字表示を停止
  stopInvestigationTextTimer();

  // 調査画面内の一時的なUIを削除
  screen.querySelectorAll(
    ".tablet-home-panel, " +
    ".investigation-tablet-panel, " +
    ".tablet-function-menu, " +
    ".investigation-point, " +
    ".investigation-result-box"
  ).forEach(element => {
    element.remove();
  });

  // 基本メニューと調査終了ボタン
  const baseMenu =
    screen.querySelector(".investigation-menu");

  const finishButton =
    screen.querySelector(".investigation-finish-btn");

  if (menuMode === "hide") {

    // 要素は残し、画面から隠す
    if (baseMenu) baseMenu.style.display = "none";
    if (finishButton) finishButton.style.display = "none";

  } else if (menuMode === "remove") {

    // 要素そのものを削除する
    baseMenu?.remove();
    finishButton?.remove();

  }

  return screen;
}

// =========================================================
// 調査地点：フラグ・持ち物・通知の更新
// =========================================================

function applyInvestigationTargetEffects(target) {

  if (!target) return;

  // -------------------------------------------------------
  // ① 調査フラグを更新
  // -------------------------------------------------------

  const flag = target.flag;

  const wasUnchecked =
    flag && investigationFlags[flag] !== true;

  if (flag) {
    investigationFlags[flag] = true;
  }

// -------------------------------------------------------
// ② アイテム取得
// -------------------------------------------------------

// 新方式：1個取得
if (typeof target.giveItem === "string") {
  addItem(target.giveItem);
}

// 新方式：複数取得
if (Array.isArray(target.giveItems)) {

  target.giveItems.forEach(itemId => {
    addItem(itemId);
  });

}

// 旧方式との互換性
if (target.findStudentBook) {
  addItem("studentBook");
}

if (target.findCharm) {
  addItem("charm");
}

// 学生手帳発見フラグ
if (
  target.findStudentBook ||
  target.giveItem === "studentBook" ||
  target.giveItems?.includes("studentBook")
) {
  investigationFlags.studentBookFound = true;
}


  // -------------------------------------------------------
  // ④ スタンプ取得時のNEW通知
  // -------------------------------------------------------

  const stampFlags = [
    "parkStampFound",
    "clockStampFound",
    "wagashiStampFound",
    "cafeStampFound",
    "observatoryStampFound"
  ];


if (
  wasUnchecked &&
  stampFlags.includes(flag)
) {
  // 更新された内容が未読の場合だけNEWを表示
  syncEbookNewNotification();
}


}

// =========================================================
// 調査中タイプライター停止
// =========================================================

function stopInvestigationTextTimer() {

  if (investigationTimerId) {

    clearInterval(
      investigationTimerId
    );

    investigationTimerId =
      null;
  }


  isInvestigationTyping =
    false;
}


// =========================================================
// 調査中タイプライター
// =========================================================

function typeWriterInvestigation(
  text,
  textElement
) {

  stopInvestigationTextTimer();


  investigationCurrentText =
    text;


  textElement.textContent =
    "";


  let index =
    0;


  isInvestigationTyping =
    true;


  investigationTimerId =
    setInterval(
      () => {

        // 画面切り替えなどで
        // 要素が消えていた場合
        if (
          !document.body.contains(
            textElement
          )
        ) {

          stopInvestigationTextTimer();

          return;
        }


        textElement.textContent +=
          text[index];


        index++;


        if (
          index >=
          text.length
        ) {

          stopInvestigationTextTimer();
        }

      },

      textSpeed
    );
}


// =========================================================
// 調査結果1行表示
// =========================================================

function showInvestigationResultEntry(
  data,
  onNext
) {

  const screen =
    document.getElementById(
      'investigation-screen'
    );


  if (!screen) {
    return;
  }




// -------------------------------------------------------
// 調査結果画面への切り替え準備
// -------------------------------------------------------

clearInvestigationView("remove");

  const resultBox =
    document.createElement(
      'div'
    );


  resultBox.className =
    'investigation-result-box';


  const displayName =
    replaceNameTags(
      data.name
    ).trim();


  const displayText =
    replaceNameTags(
      data.text
    );


  // -------------------------------------------------------
  // テキストボックスを先に作る
  // 本文はまだ入れない
  // -------------------------------------------------------

  resultBox.innerHTML = `

    ${
      displayName

        ? `
          <div
            class="investigation-result-name"
          >
            ${displayName}
          </div>
        `

        : ''
    }

    <div
      class="investigation-result-text"
    ></div>

    <div
      class="investigation-result-next"
    >
      ▽
    </div>
  `;


  screen.appendChild(
    resultBox
  );


  const textElement =
    resultBox.querySelector(
      '.investigation-result-text'
    );


  if (!textElement) {
    return;
  }


  // -------------------------------------------------------
  // 通常会話と同じ速度でタイプライター表示
  // -------------------------------------------------------

  typeWriterInvestigation(
    displayText,
    textElement
  );


  // -------------------------------------------------------
  // テキストボックスクリック
  // -------------------------------------------------------

  resultBox.addEventListener(
    'click',
    () => {

      // -----------------------------------------------
      // まだ文字表示中なら、
      // 次へ進まず全文を一気に表示
      // -----------------------------------------------

      if (
        isInvestigationTyping
      ) {

        stopInvestigationTextTimer();


        textElement.textContent =
          investigationCurrentText;


        return;
      }


      // -----------------------------------------------
      // 全文表示済みなら次の台詞へ
      // -----------------------------------------------

      resultBox.remove();


      if (onNext) {
        onNext();
      }

    }
  );
}


// =========================================================
// 調査中コマンド
// =========================================================

function runInvestigationCommand(
  command,
  onComplete
) {

  if (!command) {

    if (onComplete) {
      onComplete();
    }

    return;
  }


  // -------------------------------------------------------
  // 調査中会話
  // -------------------------------------------------------

  if (
    command.type ===
    "investigationDialogue"
  ) {

    showInvestigationResultEntry(
      {
        name:
          command.name ?? "",

        text:
          command.text ?? ""
      },

      () => {

        if (onComplete) {
          onComplete();
        }

      }
    );

    return;
  }


  console.warn(
    "未対応の調査コマンドです:",
    command.type
  );


  if (onComplete) {
    onComplete();
  }
}

// =========================================================
// 調査中コマンドを連続実行
// =========================================================

function runInvestigationCommands(
  commands,
  onComplete
) {

  let index =
    0;


  function runNext() {

    const command =
      commands[index];


    if (!command) {

      if (onComplete) {
        onComplete();
      }

      return;
    }


    runInvestigationCommand(
      command,
      () => {

        index++;

        runNext();

      }
    );
  }


  runNext();
}



  // =========================================================
  // シナリオ内容を判定して表示
  // =========================================================

function updateDialogue() {

  updateTabletButtonVisibility();

  const currentScenario =
    getCurrentScenario();


    const data =
      currentScenario[currentStep];


    if (!data) {
      return;
    }


    // -------------------------------------------------------
    // 通常会話
    // -------------------------------------------------------

    if (data.type === "dialogue") {

      showDialogueEntry(data);

      return;
    }

if (data.type === "background") {

  changeBackground(
    data.image
  );

  currentStep++;

  updateDialogue();

  return;
}


// -------------------------------------------------------
// 暗転付き背景変更
// -------------------------------------------------------

if (
  data.type ===
  "backgroundFade"
) {

  currentStep++;


  changeBackgroundWithFade(
    data.image,
    data.resetBgm === true
  ).then(
    () => {

      updateDialogue();

    }
  );


  return;
}

if (
  data.type ===
  "bgm"
) {

  // -------------------------------------------------------
  // この場面の本来のBGMとして記録
  // -------------------------------------------------------

  sceneBgm =
    data.file;


  playBgm(
    data.file
  ).then(
    () => {

      currentStep++;

      updateDialogue();

    }
  );

  return;
}


// -------------------------------------------------------
// BGM停止
// -------------------------------------------------------

if (
  data.type ===
  "bgmStop"
) {

  // この場面ではBGMなし
  sceneBgm =
    null;


  stopBgm();

  currentStep++;

  updateDialogue();

  return;
}

// -------------------------------------------------------

function nextDialogue() {

if (isTabletSpotlightActive) {
  stopAutoMode();
  stopSkipMode();
  return;
}


  // =========================================================
  // 選択肢表示中は通常の会話送りを禁止
  // =========================================================

  const choiceBox =
    document.getElementById(
      'choice-box'
    );


  if (choiceBox) {

    return;
  }


  const currentScenario =
    getCurrentScenario();


  // =========================================================
  // タイプライター途中なら全文表示
  // =========================================================

  if (
    isTyping &&
    !isSkipMode &&
    !isAutoMode
  ) {

    stopTextTimer();


    const dialogueText =
      document.getElementById(
        'dialogue-text'
      );


    if (dialogueText) {

      dialogueText.textContent =
        currentText;
    }


    return;
  }


  // =========================================================
  // 今読んだ文章を既読にする
  // =========================================================

  markCurrentStepAsRead();


  // =========================================================
  // 次へ
  // =========================================================

  currentStep++;


  // =========================================================
  // シーン終了
  // =========================================================

  if (
    currentStep >=
    currentScenario.length
  ) {

    stopSkipMode();
    stopAutoMode();


    if (
      currentScene === "prologue"
    ) {

      showNameScene();

    } else {

      showMessage(
        "シナリオここまで"
      );
    }


    return;
  }


  // =========================================================
  // 未読に到達したらSKIP終了
  // =========================================================

  if (
    isSkipMode &&
    !isCurrentStepRead()
  ) {

    stopSkipMode();
  }


  updateDialogue();
}

  // =========================================================

  function typeWriter(text) {

  const textElement =
    document.getElementById(
      'dialogue-text'
    );


  if (!textElement) {
    return;
  }


  stopTextTimer();


  textElement.textContent = "";


  let index = 0;


  isTyping = true;
  currentText = text;


  timerId =
    setInterval(
      () => {


        // 画面がすでに切り替わっていたら終了
        if (
          !document.body.contains(
            textElement
          )
        ) {

          stopTextTimer();

          return;
        }


        textElement.textContent +=
          text[index];


        index++;


        // =====================================================
        // 全文表示完了
        // =====================================================

        if (
          index >=
          text.length
        ) {

          stopTextTimer();


          // AUTO中なら少し待って次へ

     if (isAutoMode) {

  const waitTime =
    getAutoWaitTime(text);

  autoTimerId =
    setTimeout(
      () => {

        nextDialogue();

      },
      waitTime
    );
}
        }

      },
      textSpeed
    );
}

  // =========================================================
  // 名前タグ置換
  // =========================================================

  function replaceNameTags(text) {

    if (!text) {
      return "";
    }


    const fullName =
      playerLastName +
      playerFirstName;


    return text

      .replace(
        /[{｛](LAST_NAME|姓)[}｝]/g,
        playerLastName
      )

      .replace(
        /[{｛](FIRST_NAME|名)[}｝]/g,
        playerFirstName
      )

      .replace(
        /[{｛](NAME|フルネーム)[}｝]/g,
        fullName
      );
  }

  // =========================================================
  // バックログ追加
  // =========================================================

  function addDialogueToHistory(
    rawName,
    rawText
  ) {

    const name =
      replaceNameTags(
        rawName
      ).trim();


    const text =
      replaceNameTags(
        rawText
      );


    const last =
      dialogueHistory[
        dialogueHistory.length - 1
      ];


    // 同じ文章の二重登録防止
    if (
      last &&
      last.name === name &&
      last.text === text
    ) {

      return;
    }


    dialogueHistory.push({
      name,
      text
    });
  }

  // =========================================================

 function openSlotModal(mode) {

  const modalOverlay =
    document.getElementById(
      'slot-modal-overlay'
    );

  const modalHeader =
    document.getElementById(
      'slot-modal-header'
    );

  const slotList =
    document.getElementById(
      'slot-list'
    );


  modalHeader.textContent =
    mode === 'save'
      ? 'セーブするSLOTを選択'
      : 'ロードするSLOTを選択';


  slotList.innerHTML = '';


  // =====================================================
  // 第一段階：SLOTページを表示
  // =====================================================

  for (
    let page = 1;
    page <= SAVE_PAGE_COUNT;
    page++
  ) {

    const pageItem =
      document.createElement('div');

    pageItem.className =
      'slot-item';


    // このページにセーブデータがあるか確認
    let savedCount = 0;

    for (
      let sub = 1;
      sub <= SLOTS_PER_PAGE;
      sub++
    ) {

      const actualSlot =
        (page - 1) *
        SLOTS_PER_PAGE +
        sub;

      if (
        localStorage.getItem(
          `floriography_save_${actualSlot}`
        ) !== null
      ) {
        savedCount++;
      }
    }


    pageItem.innerHTML = `
      <div class="slot-info">

        <div class="slot-number">

        </div>

        <div class="slot-detail">

      'click',
      () => {

        openSavePage(
          mode,

function openSavePage(
  mode,
  page
) {

  const modalHeader =
    document.getElementById(
      'slot-modal-header'
    );

  const slotList =
    document.getElementById(
      'slot-list'
    );


  modalHeader.textContent =
    mode === 'save'
      ? `SLOT ${page}：セーブ先を選択`
      : `SLOT ${page}：ロードするデータを選択`;


  slotList.innerHTML = '';


  // =====================================================
  // 第二段階：ページ内のセーブ枠
  // =====================================================

  for (
    let subSlot = 1;
    subSlot <= SLOTS_PER_PAGE;
    subSlot++
  ) {

    const actualSlot =
      (page - 1) *
      SLOTS_PER_PAGE +
      subSlot;


    const rawData =
      localStorage.getItem(
        `floriography_save_${actualSlot}`
      );


    let saveData = null;


    if (rawData) {

      try {

        saveData =
          JSON.parse(rawData);

      } catch (e) {

        console.error(
          `セーブデータ ${actualSlot} が壊れています。`,
          e
        );
      }
    }


    const slotItem =
      document.createElement(
        'div'
      );

    slotItem.className =
      'slot-item';


    if (saveData) {

      const saveLastName =
        saveData.playerLastName
        ?? "七條";


      const saveFirstName =
        saveData.playerFirstName
        ?? "七星";


const saveChapterName =
  saveData.chapterName
  ?? sceneInfo[saveData.scene]?.name
  ?? "不明な章";


      slotItem.innerHTML = `

        <div class="slot-info">

          <div class="slot-number">
            SAVE ${subSlot}
          </div>

          <div class="slot-detail">
            ${saveChapterName}
            （${saveLastName}${saveFirstName}）
          </div>

        </div>

        <div class="slot-date">
          ${saveData.timestamp ?? ""}
        </div>
      `;


    } else {

      slotItem.innerHTML = `

        <div class="slot-info">

          <div class="slot-number">
            SAVE ${subSlot}
          </div>

          <div
            class="slot-detail"
            style="color: #666;"
          >
            データなし
          </div>

        </div>
      `;
    }


    slotItem.addEventListener(
      'click',
      () => {

if (mode === 'save') {

  // すでにデータがある場合
  if (saveData) {

    showConfirmMessage(
      "本当にセーブデータを上書き保存しますか？",
      () => {

        saveGame(
          actualSlot
        );

        closeSlotModal();
      }
    );


  } else {

    // 空きスロットなら確認なしで保存
    saveGame(
      actualSlot
    );

    closeSlotModal();
  }


} else {

  if (saveData) {

    loadGame(
      actualSlot
    );

    closeSlotModal();


  } else {

    showMessage(
      'データが存在しません。'
    );
  }
}
      }
    );


    slotList.appendChild(
      slotItem
    );
  }


  // =====================================================
  // SLOT一覧へ戻るボタン
  // =====================================================

  const backButton =
    document.createElement(
      'button'
    );

  backButton.className =
    'sidebar-btn';

  backButton.textContent =
    '← SLOT一覧に戻る';


  backButton.addEventListener(
    'click',
    () => {

      openSlotModal(
        mode
      );
    }
  );


  slotList.appendChild(
    backButton
  );
}

}


  // =========================================================

      step:
        currentStep,


      // 将来的なシナリオ変更に備えIDも保存
      entryId:
        currentEntryId,


      playerLastName:
        playerLastName,


      playerFirstName:
        playerFirstName,


  chapterName:
  getCurrentChapterName(),


      currentBackground:
      currentBackground,

sceneBgm:
  sceneBgm,

      timestamp:
        timeStr,


      dialogueHistory:
        dialogueHistory,


// -------------------------------------------------------
// 現在の調査画面の状態
// -------------------------------------------------------

isInvestigationMode: isInvestigationMode,

currentInvestigationId: currentInvestigationId,

isTabletSpotlightActive: isTabletSpotlightActive,

tabletNewNotifications: Array.from(tabletNewNotifications),

isTabletUnlocked: isTabletUnlocked,


// -------------------------------------------------------
// 調査状態
// -------------------------------------------------------

investigationFlags:
{
  ...investigationFlags
},


// -------------------------------------------------------
// タブレットアプリ解放状態
// -------------------------------------------------------

tabletAppUnlocked:
{
  ...tabletAppUnlocked
},


ebookUnlocked: {
  ...ebookUnlocked
},

// 電子書籍の既読履歴を保存
ebookReadHistory:
  JSON.parse(JSON.stringify(ebookReadHistory)),

imageUnlocked: {
  ...imageUnlocked
},


imageViewed: {
  ...imageViewed
},

locationUnlocked: {
  ...locationUnlocked
},

// -------------------------------------------------------
// 人物情報の個別解放状態
// -------------------------------------------------------

characterUnlocked: {
  ...characterUnlocked
},


// -------------------------------------------------------
// 人物プロフィールの更新段階
// -------------------------------------------------------

characterProfileStage: {
  ...characterProfileStage
},


// 人物情報：閲覧済みプロフィール段階
characterProfileReadStage: {
  ...characterProfileReadStage
},


// -------------------------------------------------------
// 持ち物
// -------------------------------------------------------

inventory: {
  ...inventory
},


// -------------------------------------------------------
// キャラクターパラメータ
// -------------------------------------------------------

characterParams:
{
  kyoya: {
    ...characterParams.kyoya
  },

  kezi: {
    ...characterParams.kezi
  },

  aoi: {
    ...characterParams.aoi
  },

  shion: {
    ...characterParams.shion
  },

  anna: {
    ...characterParams.anna
  },

  rento: {
    ...characterParams.rento
  }
}

};

    try {


      localStorage.setItem(
        `floriography_save_${slotIndex}`,
        JSON.stringify(
          saveData
        )
      );


      showMessage(
        `スロット ${slotIndex} にセーブしました。`
      );


    } catch (e) {


      console.error(
        "セーブに失敗しました。",
        e
      );


      showMessage(
        "セーブに失敗しました。"
      );
    }
  }


  // =========================================================
  // ロード
  // =========================================================

async function loadGame(slotIndex) {

    const rawData =
      localStorage.getItem(
        `floriography_save_${slotIndex}`
      );


    if (!rawData) {
      return;
    }


    let saveData;


    try {


      saveData =
        JSON.parse(
          rawData
        );


    } catch (e) {


      console.error(
        "セーブデータの読み込みに失敗しました。",
        e
      );


      showMessage(
        "セーブデータを読み込めませんでした。"
      );


      return;
    }


    stopSkipMode();
    stopTextTimer();
    stopAutoMode();


    // -------------------------------------------------------
    // シーン復元
    // -------------------------------------------------------

if (saveData.scene) {

  currentScene =
    saveData.scene;

} else {

  // 古いセーブデータとの互換用
  currentScene =
    getSceneIdFromChapterName(
      saveData.chapterName
    );
}


    // -------------------------------------------------------
    // 名前復元
    // -------------------------------------------------------

    playerLastName =
      saveData.playerLastName
      ?? "七條";


    playerFirstName =
      saveData.playerFirstName
      ?? "七星";


// -------------------------------------------------------
// 調査・タブレット状態を一度初期化
// -------------------------------------------------------

resetInvestigationAndTabletState();

resetLocationUnlocked();

resetEbookUnlocked();

// 電子書籍の既読履歴をいったん初期化
resetEbookReadHistory();

resetImageUnlocked();

resetImageViewed();

// NEW通知を初期化・復元
tabletNewNotifications.clear();

if (Array.isArray(saveData.tabletNewNotifications)) {

  saveData.tabletNewNotifications.forEach(appId => {

    if (appId in DEFAULT_TABLET_APP_UNLOCKED) {
      tabletNewNotifications.add(appId);
    }

  });

}

updateTabletNewBadge();

resetInventory();


// -------------------------------------------------------
// キャラクターパラメータも一度初期化
// -------------------------------------------------------

resetCharacterParams();


resetCharacterUnlocked();


resetCharacterProfileStage();


resetCharacterProfileReadStage();



// -------------------------------------------------------
// 調査状態を復元
// -------------------------------------------------------

if (
  saveData.investigationFlags &&
  typeof saveData.investigationFlags ===
    "object"
) {

  Object.assign(
    investigationFlags,
    saveData.investigationFlags
  );
}


// -------------------------------------------------------
// 持ち物を復元
// -------------------------------------------------------

if (
  saveData.inventory &&
  typeof saveData.inventory ===
    "object"
) {

  Object.assign(
    inventory,
    saveData.inventory
  );

} else {

  // -----------------------------------------------------
  // 旧セーブデータ互換
  // -----------------------------------------------------

  if (
    investigationFlags
      .studentBookFound
  ) {

    inventory.studentBook =
      true;
  }
}


// -------------------------------------------------------
// タブレットアプリ解放状態を復元
// -------------------------------------------------------

if (
  saveData.tabletAppUnlocked &&
  typeof saveData.tabletAppUnlocked ===
    "object"
) {

  Object.assign(
    tabletAppUnlocked,
    saveData.tabletAppUnlocked
  );
}


// タブレット本体の解放状態を復元
isTabletUnlocked =
  typeof saveData.isTabletUnlocked === "boolean"
    ? saveData.isTabletUnlocked
    : tabletAppUnlocked.characters === true;


// -------------------------------------------------------
// 移動先の解放状態を復元
// -------------------------------------------------------

if (
  saveData.locationUnlocked &&
  typeof saveData.locationUnlocked === "object"
) {

  Object.keys(LOCATION_DATA).forEach(locationId => {

    locationUnlocked[locationId] =
      saveData.locationUnlocked[locationId] === true;

  });

}


// =========================================================
// 電子書籍：文書解放状態を復元
// =========================================================

if (
  saveData.ebookUnlocked &&
  typeof saveData.ebookUnlocked === "object"
) {

  Object.keys(DEFAULT_EBOOK_UNLOCKED).forEach(
    bookId => {

      if (typeof saveData.ebookUnlocked[bookId] === "boolean") {
        ebookUnlocked[bookId] = saveData.ebookUnlocked[bookId];
      }

    }
  );

}



// =========================================================
// 電子書籍：セーブ時点の既読履歴を復元
// =========================================================

if (
  saveData.ebookReadHistory &&
  typeof saveData.ebookReadHistory === "object" &&
  !Array.isArray(saveData.ebookReadHistory)
) {

  Object.entries(saveData.ebookReadHistory)
    .forEach(([bookId, pages]) => {

      if (
        !EBOOK_DATA[bookId] ||
        !pages ||
        typeof pages !== "object" ||
        Array.isArray(pages)
      ) {
        return;
      }

      ebookReadHistory[bookId] = {};

      Object.entries(pages)
        .forEach(([pageIndex, contents]) => {

          if (
            !Number.isInteger(Number(pageIndex)) ||
            Number(pageIndex) < 0 ||
            Number(pageIndex) >= EBOOK_DATA[bookId].pages.length ||
            !Array.isArray(contents)
          ) {
            return;
          }

          ebookReadHistory[bookId][pageIndex] =
            contents.filter(text => typeof text === "string");

        });

    });

}



// -------------------------------------------------------
// 画像フォルダ：取得状態を復元
// -------------------------------------------------------

if (
  saveData.imageUnlocked &&
  typeof saveData.imageUnlocked === "object"
) {

  Object.keys(IMAGE_DATA).forEach(imageId => {

    imageUnlocked[imageId] =
      saveData.imageUnlocked[imageId] === true;

  });

}


// 画像ごとの既読状態を復元
if (
  saveData.imageViewed &&
  typeof saveData.imageViewed === "object"
) {

  Object.keys(IMAGE_DATA).forEach(imageId => {

    if (
      imageUnlocked[imageId] === true &&
      saveData.imageViewed[imageId] === true
    ) {
      imageViewed[imageId] = true;
    }

  });

}


// -------------------------------------------------------
// 人物情報の個別解放状態を復元
// -------------------------------------------------------

if (
  saveData.characterUnlocked &&
  typeof saveData.characterUnlocked === "object"
) {

  Object.keys(DEFAULT_CHARACTER_UNLOCKED)
    .forEach(characterId => {

characterUnlocked[characterId] =
  typeof saveData.characterUnlocked[characterId] === "boolean"
    ? saveData.characterUnlocked[characterId]
    : DEFAULT_CHARACTER_UNLOCKED[characterId];

    });
}


// -------------------------------------------------------
// 人物プロフィールの更新段階を復元
// -------------------------------------------------------

if (
  saveData.characterProfileStage &&
  typeof saveData.characterProfileStage === "object"
) {

  Object.entries(saveData.characterProfileStage)
    .forEach(([characterId, stage]) => {

      if (
        CHARACTER_PROFILE_DATA[characterId] &&
        Number.isInteger(stage) &&
        stage >= 1
      ) {

        characterProfileStage[characterId] = stage;

      }

    });

}




// =========================================================
// 人物情報：セーブ時点の既読履歴を復元
// =========================================================

if (
  saveData.characterProfileReadStage &&
  typeof saveData.characterProfileReadStage === "object" &&
  !Array.isArray(saveData.characterProfileReadStage)
) {

  Object.entries(saveData.characterProfileReadStage)
    .forEach(([characterId, savedStage]) => {

      if (
        CHARACTER_PROFILE_DATA[characterId] &&
        Number.isInteger(savedStage) &&
        savedStage >= 0
      ) {

        characterProfileReadStage[characterId] =
          Math.min(
            savedStage,
            getCharacterProfileStage(characterId)
          );

      }

    });

}




// -------------------------------------------------------
// キャラクターパラメータを復元
// -------------------------------------------------------

if (
  saveData.characterParams &&
  typeof saveData.characterParams ===
    "object"
) {

  Object.keys(
    DEFAULT_CHARACTER_PARAMS
  ).forEach(
    characterId => {

      const savedCharacter =
        saveData.characterParams[
          characterId
        ];


      if (
        savedCharacter &&
        typeof savedCharacter ===
          "object"
      ) {

        Object.assign(
          characterParams[
            characterId
          ],
          savedCharacter
        );
      }

    }
  );
}


    // -------------------------------------------------------
    // バックログ復元
    // -------------------------------------------------------

    dialogueHistory =
      Array.isArray(
        saveData.dialogueHistory
      )

        ? saveData.dialogueHistory

        : [];


    const currentScenario =
      getCurrentScenario();


    // -------------------------------------------------------
    // 新方式：entryIdから位置を探す
    // -------------------------------------------------------

    if (saveData.entryId) {


      const foundIndex =
        currentScenario.findIndex(
          item =>
            item.id ===
            saveData.entryId
        );


      if (foundIndex !== -1) {


        currentStep =
          foundIndex;


      } else {


        currentStep =
          Number.isInteger(
            saveData.step
          )

            ? saveData.step

            : 0;
      }


    } else {


      // 旧セーブデータ
      currentStep =
        Number.isInteger(
          saveData.step
        )

          ? saveData.step

          : 0;
    }


    // -------------------------------------------------------
    // 範囲外防止
    // -------------------------------------------------------

    if (currentStep < 0) {

      currentStep = 0;
    }


    if (
      currentStep >=
      currentScenario.length
    ) {

      currentStep =
        currentScenario.length - 1;
    }


// -------------------------------------------------------
// 背景復元
// -------------------------------------------------------

changeBackground(
  saveData.currentBackground ?? null
);


// -------------------------------------------------------
// シーンBGM復元
// -------------------------------------------------------

if (
  Object.prototype.hasOwnProperty.call(
    saveData,
    "sceneBgm"
  )
) {

  // version 6以降
  sceneBgm =
    saveData.sceneBgm
    ?? null;

} else {

  // -----------------------------------------------------
  // 旧セーブデータ
  //
  // 旧currentBgmにはタブレットBGMなどが
  // 入っている可能性があるため、
  // シナリオから本来のBGMを再計算する
  // -----------------------------------------------------

  sceneBgm =
    getSceneBgmFromScenario(
      currentScenario,
      currentStep
    );
}


// -------------------------------------------------------
// BGM再生
// -------------------------------------------------------

if (
  sceneBgm
) {

  await playBgm(
    sceneBgm
  );

} else {

  stopBgm();
}



// -------------------------------------------------------
// 現在の画面を復元
// -------------------------------------------------------

const currentData = currentScenario[currentStep];

if (
  currentData &&
  currentData.type === "investigation"
) {

  // セーブ時の実際の現在地を優先
  const savedLocationId =
    saveData.isInvestigationMode === true &&
    typeof saveData.currentInvestigationId === "string" &&
    investigationData[saveData.currentInvestigationId]
      ? saveData.currentInvestigationId
      : currentData.investigationId;

  renderInvestigationScreen(savedLocationId);

} else {

  // 通常の会話画面を復元
  renderDialogueScreen();

  updateDialogue();

}


// -------------------------------------------------------
// フェード解除
// -------------------------------------------------------

gameContainer.classList.remove(
  'fade-out'
);

setTabletSpotlight(
  saveData.isTabletSpotlightActive === true
);


// =========================================================
// セーブ時点の既読履歴に基づいてNEW通知を再判定
// =========================================================


syncEbookNewNotification();

syncCharacterNewNotification();

}
