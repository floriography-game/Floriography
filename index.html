<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Floriography</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">

  <style>
html, body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background-color: #1a1a1a;
  color: #ffffff;

  font-family: 'Shippori Mincho', serif;

  user-select: none;
}


/* =========================================================
   ゲーム画面全体
   ========================================================= */

#game-stage {
  width: 1280px;
  height: 720px;

  position: absolute;

  left: 50%;
  top: 50%;

  transform-origin: center center;

  overflow: hidden;

  background-color: #2b2b2b;

  will-change: transform;

  opacity: 0;

  transition: opacity 0.25s ease;
}

#game-container {
  width: 100%;
  height: 100%;

  background-color: #2b2b2b;

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  gap: 30px;
  padding: 20px;

  box-sizing: border-box;

  transition: opacity 0.4s ease;

  position: relative;
}

/* 画面切り替え用フェードアウト */
.fade-out {
  opacity: 0;
}


/* =========================================================
   シーン切り替え用暗転
   ========================================================= */

.scene-transition-overlay {
  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  background-color: #000000;

  opacity: 0;
  visibility: hidden;

  pointer-events: none;

  transition:
    opacity 0.6s ease,
    visibility 0.6s ease;

  z-index: 4500;
}


.scene-transition-overlay.active {
  opacity: 1;
  visibility: visible;

  pointer-events: auto;
}


    /* --- タイトル画面 --- */
    #title-text {
      font-family: 'Dancing Script', cursive;
      font-size: 68px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
      margin: 0;
      text-align: center;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .btn {
      padding: 12px 40px;
      font-size: 20px;
      font-family: 'Shippori Mincho', serif;
      background-color: transparent;
      color: #ffffff;
      border: 1px solid #ffffff;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background-color: #ffffff;
      color: #2b2b2b;
    }

    /* --- 右上MENUボタン --- */
.menu-trigger-container {
  position: absolute;
      top: 15px;
      right: 15px;
      z-index: 1000;
      display: none;
    }

    .menu-trigger-container.active {
      display: block;
    }

    .sys-btn {
      padding: 8px 20px;
      font-size: 15px;
      font-family: 'Shippori Mincho', serif;
      background-color: rgba(0, 0, 0, 0.7);
      color: #d4af37;
      border: 1px solid #d4af37;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 1px;
    }

    .sys-btn:hover {
      background-color: #d4af37;
      color: #000000;
    }

    /* --- サイドバー UI --- */
    .sidebar-overlay {
      position: absolute;     
       top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .sidebar-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .sidebar {
      position: absolute;
      top: 0;
      right: -280px;
      width: 200px;
      height: 100%;
      background-color: rgba(20, 20, 20, 0.95);
      border-left: 1px solid #d4af37;
      box-shadow: -5px 0 15px rgba(0, 0, 0, 0.4);
      z-index: 2001;
      display: flex;
      flex-direction: column;
      padding: 30px 20px;
      box-sizing: border-box;
      transition: right 0.3s ease;
    }

    .sidebar.open {
      right: 0;
    }

    .sidebar-title {
      font-size: 20px;
      color: #d4af37;
      border-bottom: 1px solid #d4af37;
      padding-bottom: 10px;
      margin-bottom: 30px;
      text-align: center;
      letter-spacing: 2px;
    }

    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .sidebar-btn {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-family: 'Shippori Mincho', serif;
      background-color: transparent;
      color: #ffffff;
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .sidebar-btn:hover {
      background-color: #d4af37;
      color: #000000;
      border-color: #d4af37;
    }

    .sidebar-close-btn {
      margin-top: auto;
      border-color: rgba(255, 255, 255, 0.3);
      color: #888888;
    }

    .sidebar-close-btn:hover {
      background-color: #ffffff;
      color: #000000;
    }

    /* --- モーダル共通 --- */
    .slot-modal-overlay, .log-modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 3000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .slot-modal-overlay.active, .log-modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .slot-modal {
      width: 90%;
      max-width: 600px;
      background-color: rgba(25, 25, 25, 0.95);
      border: 1px solid #d4af37;
      border-radius: 8px;
      padding: 25px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .slot-modal-header {
      font-size: 22px;
      color: #d4af37;
      text-align: center;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      padding-bottom: 10px;
      letter-spacing: 2px;
    }

   .slot-list {
  display: flex;
  flex-direction: column;
  gap: 12px;

  max-height: 60vh;
  overflow-y: auto;
  padding-right: 6px;
}
    .slot-item {
      padding: 15px 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      background-color: rgba(0, 0, 0, 0.5);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }

    .slot-item:hover {
      border-color: #d4af37;
      background-color: rgba(212, 175, 55, 0.15);
    }

    .slot-info {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .slot-number {
      font-size: 16px;
      color: #d4af37;
      font-weight: bold;
    }

    .slot-detail {
      font-size: 14px;
      color: #cccccc;
    }

    .slot-date {
      font-size: 12px;
      color: #888888;
    }

    /* --- バックログモーダル --- */
    .log-modal {
      width: 90%;
      max-width: 700px;
      height: 80vh;
      background-color: rgba(25, 25, 25, 0.8);
      border: 1px solid #d4af37;
      border-radius: 8px;
      padding: 25px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .log-modal-header {
      font-size: 22px;
      color: #d4af37;
      text-align: center;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      padding-bottom: 10px;
      letter-spacing: 2px;
      flex-shrink: 0;
    }

    .log-container {
      flex: 1;
      overflow-y: auto;
      padding-right: 10px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      user-select: text;
    }

    .log-container::-webkit-scrollbar {
      width: 6px;
    }

    .log-container::-webkit-scrollbar-thumb {
      background: #d4af37;
      border-radius: 3px;
    }

    .log-container::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
    }

    .log-entry {
      border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }

    .log-speaker {
      color: #d4af37;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .log-text {
      color: #e0e0e0;
      font-size: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    /* --- ゲーム本編画面 --- */
    .game-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 30px;
      box-sizing: border-box;
    }

    /* 会話枠 */
    .dialogue-box {
  width: calc(100% - 90px);
  max-width: none;

  height: 180px;

  background-color: rgba(0, 0, 0, 0.8);
  border: 1px solid #d4af37;
  border-radius: 8px;

  padding: 20px 25px;

  box-sizing: border-box;

  font-size: 18px;
  line-height: 1.8;

  position: relative;

  transform: translateY(30px);
}

 .character-name {
  position: absolute;

  /* 会話ボックス左端に揃える */
  left: 0;

  /* 会話ボックスの外側へ持ち上げる */
  top: -48px;

  min-width: 190px;
  height: 42px;

  padding: 0 18px;

  display: flex;
  align-items: center;
  justify-content: center;

  box-sizing: border-box;

  background-color: rgba(0, 0, 0, 0.82);

  border: 1px solid #d4af37;
  border-radius: 6px;

  color: #d4af37;

  font-size: 18px;
  font-weight: bold;

  margin: 0;

  z-index: 25;

  white-space: nowrap;
}


/* 会話本文の改行を反映 */
#dialogue-text {
  white-space: pre-wrap;
  font-size: 23px;
  line-height: 1.7;

  margin-top: 6px;
}

    .next-mark {
      position: absolute;
      right: 15px;
      bottom: 10px;
      color: #d4af37;
      font-size: 18px;
      cursor: pointer;
      padding: 10px 15px;
      animation: bounce 1s infinite alternate;
      z-index: 10;
    }

    .next-mark:hover {
      color: #ffffff;
    }

    /* 「×」非表示用ボタン */
    .close-btn {
      position: absolute;
      top: 8px;
      right: 12px;
      background: transparent;
      border: none;
      font-size: 27px;
      cursor: pointer;
      color: #888;
      padding: 0;
      line-height: 1;
      transition: color 0.2s ease;
      z-index: 20;
    }

    .close-btn:hover {
      color: #d4af37;
    }

    /* 非表示用クラス */
    .hidden {
      display: none !important;
    }

    /* --- 名前入力画面 --- */
    .input-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }

    .input-prompt {
      font-size: 20px;
      letter-spacing: 2px;
      color: #d4af37;
    }

    .name-input {
      padding: 10px 15px;
      font-size: 20px;
      font-family: 'Shippori Mincho', serif;
      background-color: rgba(0, 0, 0, 0.5);
      color: #ffffff;
      border: 1px solid #d4af37;
      border-radius: 4px;
      text-align: center;
      outline: none;
      user-select: auto;
    }

    .name-input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
    }

    /* --- CONFIGモーダル --- */
    .config-modal {
      width: 90%;
      max-width: 500px;
      background-color: rgba(25, 25, 25, 0.95);
      border: 1px solid #d4af37;
      border-radius: 8px;
      padding: 25px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .config-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .config-label {
      color: #d4af37;
      font-size: 16px;
      display: flex;
      justify-content: space-between;
    }

    .config-slider {
      width: 100%;
      accent-color: #d4af37;
      cursor: pointer;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-5px); }
    }

/* AUTOボタン */
.auto-btn {
  position: absolute;

  top: -18px;
  right: 112px;

  width: 64px;
  height: 38px;

  padding: 0;

  border-radius: 6px;

  background-color: rgba(0, 0, 0, 0.82);
  border: 1px solid #888;

  color: #888;

  font-size: 13px;
  font-family: 'Shippori Mincho', serif;

  display: flex;
  justify-content: center;
  align-items: center;

  cursor: pointer;
  transition: all 0.2s ease;

  z-index: 20;
}


/* SKIPボタン */
.skip-btn {
  position: absolute;

  top: -18px;
  right: 40px;

  width: 64px;
  height: 38px;

  padding: 0;

  border-radius: 6px;

  background-color: rgba(0, 0, 0, 0.82);
  border: 1px solid #888;

  color: #888;

  font-size: 13px;
  font-family: 'Shippori Mincho', serif;

  display: flex;
  justify-content: center;
  align-items: center;

  cursor: pointer;
  transition: all 0.2s ease;

  z-index: 20;
}

/* カーソルを載せたとき */
.auto-btn:hover,
.skip-btn:hover {
  color: #d4af37;
  border-color: #d4af37;
  background-color: rgba(80, 80, 80, 0.9);
}

/* AUTO実行中 */
.auto-btn.active-auto {
  color: #000;
  background-color: #d4af37;
  border-color: #d4af37;
  font-weight: bold;
}


/* =========================================================
   名前確認ウィンドウ
   ========================================================= */

.name-confirm-overlay {
  position: absolute;
  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  display: flex;
  justify-content: center;
  align-items: center;

  z-index: 100;

  /* 最初は背景を透明に */
  background-color: rgba(0, 0, 0, 0);
  backdrop-filter: blur(0px);

  transition:
    background-color 0.45s ease,
    backdrop-filter 0.45s ease;
}

.name-confirm-overlay.show {
  background-color: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(2px);
}

.name-confirm-box {
  width: 90%;
  max-width: 420px;

  background-color: rgba(25, 25, 25, 0.97);

  border: 1px solid #d4af37;
  border-radius: 8px;

  padding: 30px;

  box-sizing: border-box;

  text-align: center;

  box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);

  /* 最初は透明 */
  opacity: 0;

  /* 0.12秒遅れてフェード開始 */
  transition:
    opacity 0.4s ease 0.5s;
}

.name-confirm-overlay.show .name-confirm-box {
  opacity: 1;
}

.name-confirm-text {
  font-size: 19px;
  line-height: 1.8;

  margin-bottom: 25px;

  color: #ffffff;
}

.name-confirm-player-name {
  color: #d4af37;

  font-size: 23px;
  font-weight: bold;

  margin: 8px 0;
}

.name-confirm-buttons {
  display: flex;
  justify-content: center;

  gap: 20px;
}

.name-confirm-btn {
  min-width: 100px;

  padding: 10px 25px;

  font-size: 16px;
  font-family: 'Shippori Mincho', serif;

  background-color: transparent;
  color: #ffffff;

  border: 1px solid #d4af37;
  border-radius: 4px;

  cursor: pointer;

  transition: all 0.2s ease;
}

.name-confirm-btn:hover {
  background-color: #d4af37;
  color: #000000;
}


/* =========================================================
   共通メッセージウィンドウ
   ========================================================= */

.message-overlay {
  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  display: flex;
  justify-content: center;
  align-items: center;

  background-color: rgba(0, 0, 0, 0.55);

  opacity: 0;
  visibility: hidden;

  transition:
    opacity 0.2s ease,
    visibility 0.2s ease;

  z-index: 5000;
}


.message-overlay.active {
  opacity: 1;
  visibility: visible;
}


.message-box {
  width: 430px;

  padding: 30px 35px;

  box-sizing: border-box;

  background-color: rgba(35, 35, 35, 0.97);

  border: 1px solid #d4af37;
  border-radius: 8px;

  text-align: center;

  box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
}


.message-text {
  margin-bottom: 25px;

  font-size: 20px;
  line-height: 1.7;

  color: #ffffff;

  white-space: pre-wrap;
}


.message-ok-btn {
  min-width: 110px;

  padding: 10px 26px;

  font-family: 'Shippori Mincho', serif;
  font-size: 16px;

  color: #d4af37;

  background-color: rgba(60, 60, 60, 0.9);

  border: 1px solid #d4af37;
  border-radius: 5px;

  cursor: pointer;

  transition: all 0.2s ease;
}

.message-buttons {
  display: flex;
  justify-content: center;
  gap: 20px;
}

.message-ok-btn:hover {
  color: #ffffff;

  background-color: rgba(90, 90, 90, 0.95);
}


/* =========================================================
   調査モード
   ========================================================= */

.investigation-screen {
  position: relative;

  width: 100%;
  height: 100%;

  box-sizing: border-box;
}


/* ---------------------------------------------------------
   下部 2×2 メニュー
   --------------------------------------------------------- */

.investigation-menu {
  position: absolute;

  left: 50%;
  bottom: 38px;

  transform: translateX(-50%);

  width: 420px;

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 12px;

  z-index: 100;
}


.investigation-menu-btn {
  height: 58px;

  font-family:
    'Shippori Mincho',
    serif;

  font-size: 18px;

  color: #ffffff;

  background-color:
    rgba(0, 0, 0, 0.82);

  border:
    1px solid #d4af37;

  border-radius: 6px;

  cursor: pointer;

  transition:
    background-color 0.2s ease,
    color 0.2s ease,
    opacity 0.2s ease;
}


.investigation-menu-btn:hover {
  color: #000000;

  background-color:
    #d4af37;
}


/* 使用不可 */
.investigation-menu-btn:disabled {
  color: #777777;

  border-color: #555555;

  background-color:
    rgba(0, 0, 0, 0.65);

  cursor: default;

  opacity: 0.65;
}


/* ---------------------------------------------------------
   調査終了ボタン
   --------------------------------------------------------- */

.investigation-finish-btn {
  position: absolute;

  left: 50%;
  bottom: 180px;

  transform:
    translateX(-50%);

  width: 220px;
  height: 52px;

  font-family:
    'Shippori Mincho',
    serif;

  font-size: 17px;

  color:
    #d4af37;

  background-color:
    rgba(0, 0, 0, 0.86);

  border:
    1px solid #d4af37;

  border-radius:
    6px;

  cursor:
    pointer;

  z-index:
    110;

  transition:
    all 0.2s ease;
}


.investigation-finish-btn:hover {
  color:
    #000000;

  background-color:
    #d4af37;
}


/* ---------------------------------------------------------
   タブレット表示
   --------------------------------------------------------- */

.investigation-tablet-panel {
  position: absolute;

  top: 35px;
  left: 50%;

  transform:
    translateX(-50%);

  min-width: 420px;

  padding:
    14px 22px;

  box-sizing:
    border-box;

  background-color:
    rgba(15, 25, 30, 0.88);

  border:
    1px solid #d4af37;

  border-radius:
    8px;

  text-align:
    center;

  z-index:
    110;
}


.investigation-tablet-title {
  color:
    #d4af37;

  font-size:
    19px;

  margin-bottom:
    6px;
}


.investigation-tablet-text {
  color:
    #dddddd;

  font-size:
    14px;
}


/* ---------------------------------------------------------
   調査画面：戻るボタン
   --------------------------------------------------------- */

.investigation-tablet-back-btn {
  position: absolute;

  top: 10px;
  right: 12px;

  padding:
    6px 14px;

  font-family:
    'Shippori Mincho',
    serif;

  font-size:
    14px;

  color:
    #d4af37;

  background-color:
    rgba(0, 0, 0, 0.65);

  border:
    1px solid #d4af37;

  border-radius:
    5px;

  cursor:
    pointer;

  transition:
    all 0.2s ease;
}


.investigation-tablet-back-btn:hover {
  color:
    #000000;

  background-color:
    #d4af37;
}


/* ---------------------------------------------------------
   調査ポイント
   --------------------------------------------------------- */

.investigation-point {
  position: absolute;

  min-width:
    145px;

  padding:
    10px 15px;

  font-family:
    'Shippori Mincho',
    serif;

  font-size:
    16px;

  color:
    #ffffff;

  background-color:
    rgba(0, 0, 0, 0.78);

  border:
    1px solid #d4af37;

  border-radius:
    22px;

  cursor:
    pointer;

  z-index:
    90;

  transition:
    transform 0.15s ease,
    background-color 0.15s ease;
}

// =========================================================
// BGM音量
// 0.0 ～ 1.0
// =========================================================

let bgmVolume =
  0.5;


try {

  const savedBgmVolume =
    localStorage.getItem(
      'floriography_bgm_volume'
    );


  if (
    savedBgmVolume !== null
  ) {

    const parsedVolume =
      parseFloat(
        savedBgmVolume
      );


    if (
      !Number.isNaN(
        parsedVolume
      )
    ) {

      bgmVolume =
        Math.min(
          1,
          Math.max(
            0,
            parsedVolume
          )
        );
    }
  }

} catch (e) {

  console.error(
    "BGM音量設定の読み込みに失敗しました。",
    e
  );
}


// 一度読み込んだBGMを保存
const bgmBufferCache =
  new Map();


// 同じファイルを同時に何度も読み込まないための記録
const bgmLoadingPromises =
  new Map();


// 古い再生要求が後から実行されるのを防ぐ
let bgmActionId = 0;


// =========================================================
// AudioContextを準備
// =========================================================

function getAudioContext() {

  if (!audioContext) {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    audioContext =
      new AudioContextClass();


    bgmGainNode =
      audioContext.createGain();

bgmGainNode.gain.value =
  bgmVolume;

    bgmGainNode.connect(
      audioContext.destination
    );
  }

  return audioContext;
}


// =========================================================
// BGMファイルをメモリへ読み込む
// =========================================================

async function loadBgmBuffer(fileName) {

  // すでに読み込み済み
  if (
    bgmBufferCache.has(
      fileName
    )
  ) {

    return bgmBufferCache.get(
      fileName
    );
  }


  // 現在読み込み中なら、その処理を待つ
  if (
    bgmLoadingPromises.has(
      fileName
    )
  ) {

    return bgmLoadingPromises.get(
      fileName
    );
  }


  const context =
    getAudioContext();


  const loadingPromise =
    fetch(
      `audio/${fileName}`
    )
      .then(
        response => {

          if (!response.ok) {

            throw new Error(
              `BGMファイルを取得できませんでした: ${fileName}`
            );
          }

          return response.arrayBuffer();
        }
      )
      .then(
        arrayBuffer =>
          context.decodeAudioData(
            arrayBuffer
          )
      )
      .then(
        audioBuffer => {

          bgmBufferCache.set(
            fileName,
            audioBuffer
          );

          bgmLoadingPromises.delete(
            fileName
          );

          return audioBuffer;
        }
      )
      .catch(
        error => {

          bgmLoadingPromises.delete(
            fileName
          );

          throw error;
        }
      );


  bgmLoadingPromises.set(
    fileName,
    loadingPromise
  );


  return loadingPromise;
}


// =========================================================
// BGMを先読み
// =========================================================

async function prepareBgm(fileName) {

  try {

    const context =
      getAudioContext();


    // ユーザー操作中にAudioContextを有効化
    if (
      context.state ===
      "suspended"
    ) {

      await context.resume();
    }


    // 音は鳴らさず、メモリへ読み込むだけ
    await loadBgmBuffer(
      fileName
    );

  } catch (error) {

    console.warn(
      "BGMの準備に失敗しました:",
      error
    );
  }
}

// =========================================================
// 背景変更
// =========================================================

function changeBackground(imageName) {

  // 現在の背景を記憶
  currentBackground = imageName;


  if (!imageName) {

    gameContainer.style.backgroundImage =
      'none';

    return;
  }


  gameContainer.style.backgroundImage =
    `url("backgrounds/${imageName}")`;
}


// =========================================================
// BGM再生
// =========================================================

async function playBgm(fileName) {

  // 同じ曲がすでに再生中なら何もしない
  if (
    currentBgm === fileName &&
    currentBgmSource
  ) {

    return true;
  }


  const actionId =
    ++bgmActionId;


  try {

    const context =
      getAudioContext();


    // 必要ならAudioContextを再開
    if (
      context.state ===
      "suspended"
    ) {

      await context.resume();
    }


    // 音源を読み込み
    const buffer =
      await loadBgmBuffer(
        fileName
      );


    // 読み込み中に別のBGM操作が行われていたら中止
    if (
      actionId !==
      bgmActionId
    ) {

      return false;
    }


    // 現在のBGMを停止
    if (currentBgmSource) {

      try {

        currentBgmSource.stop();

      } catch (error) {

        // すでに停止済みなら無視
      }


      currentBgmSource.disconnect();

      currentBgmSource = null;
    }


    // 新しい再生ノードを作る
    const source =
      context.createBufferSource();


    source.buffer =
      buffer;


    // シームレスループ
    source.loop =
      true;


    source.connect(
      bgmGainNode
    );


    currentBgmSource =
      source;

    currentBgm =
      fileName;


    // 曲頭から再生
    source.start(0);


    return true;


  } catch (error) {

    console.warn(
      "BGMの再生に失敗しました:",
      error
    );

    return false;
  }
}


// =========================================================
// BGM停止
// =========================================================

function stopBgm() {

  // 読み込み途中のBGMも無効化
  bgmActionId++;


  if (currentBgmSource) {

    try {

      currentBgmSource.stop();

    } catch (error) {

      // すでに停止済みなら無視
    }


    currentBgmSource.disconnect();

    currentBgmSource =
      null;
  }


  currentBgm =
    null;
}



// =========================================================
// BGMをフェードアウトしてリセット
// =========================================================

function fadeOutAndResetBgm(
  duration = 600
) {

  return new Promise(
    resolve => {

      // BGMが流れていなければ何もしない
      if (
        !currentBgmSource ||
        !bgmGainNode ||
        !audioContext
      ) {

        resolve();

        return;
      }


      const now =
        audioContext.currentTime;


      const currentVolume =
        bgmGainNode.gain.value;


      // 以前の音量変化予約を解除
      bgmGainNode.gain
        .cancelScheduledValues(
          now
        );


      // 現在音量から開始
      bgmGainNode.gain
        .setValueAtTime(
          currentVolume,
          now
        );


      // durationミリ秒かけて0へ
      bgmGainNode.gain
        .linearRampToValueAtTime(
          0,
          now + duration / 1000
        );


      setTimeout(
        () => {

          // BGMそのものを停止
          stopBgm();


          // 次にBGMを再生するときのため、
          // Configで設定された音量へ戻す
          if (bgmGainNode) {

            bgmGainNode.gain
              .cancelScheduledValues(
                audioContext.currentTime
              );


            bgmGainNode.gain.value =
              bgmVolume;
          }


          resolve();

        },

        duration
      );

    }
  );
}


// =========================================================
// 背景画像の先読み
// =========================================================

function preloadBackground(imageName) {

  return new Promise(
    resolve => {

      const img =
        new Image();


      img.onload =
        () => {
          resolve();
        };


      img.onerror =
        () => {

          console.warn(
            "背景画像の先読みに失敗しました:",
            imageName
          );

          resolve();
        };


      img.src =
        `backgrounds/${imageName}`;
    }
  );
}


// =========================================================
// 暗転しながら背景を変更
// =========================================================

async function changeBackgroundWithFade(
  imageName,
  resetBgm = false
) {

  const overlay =
    document.getElementById(
      'scene-transition-overlay'
    );


  if (!overlay) {
    changeBackground(imageName);
    return;
  }


  // 新しい背景を先読み
  await preloadBackground(
    imageName
  );


  // 暗転開始
  overlay.classList.add(
    'active'
  );


// -------------------------------------------------------
// 必要な場合だけBGMもフェードアウト
// -------------------------------------------------------

let bgmResetPromise =
  Promise.resolve();


if (resetBgm) {

  bgmResetPromise =
    fadeOutAndResetBgm(
      600
    );
}


// -------------------------------------------------------
// 画面暗転とBGMフェードアウトを同時に待つ
// -------------------------------------------------------

await Promise.all([
  new Promise(
    resolve =>
      setTimeout(
        resolve,
        600
      )
  ),

  bgmResetPromise
]);


// -------------------------------------------------------
// 完全暗転した時点でバックログをリセット
// -------------------------------------------------------

resetDialogueHistory();


  // 完全に暗くなってから背景変更
  changeBackground(
    imageName
  );


  // ブラウザに新背景を一度描画させる
  await new Promise(
    resolve =>
      requestAnimationFrame(
        resolve
      )
  );


  // 暗転解除
  overlay.classList.remove(
    'active'
  );
}

// =========================================================
// 章名からシーンIDを取得
// 旧セーブデータ互換用
// =========================================================

function getSceneIdFromChapterName(
  chapterName
) {

  const entry =
    Object.entries(
      sceneInfo
    ).find(
      ([sceneId, info]) =>
        info.name === chapterName
    );


  return entry
    ? entry[0]
    : "prologue";
}

    if (!data) {
      return null;
    }


    // 新方式
    if (data.id) {
      return data.id;
    }


    // 万一旧形式のデータが残っていた場合
    return `${currentScene}_${currentStep}`;
  }


  // =========================================================
  // 既読判定
  // =========================================================

  function isCurrentStepRead() {

    const id =
      getCurrentEntryId();


    if (!id) {
      return false;
    }


    return readFlags.includes(id);
  }


  // =========================================================
  // 既読登録
  // =========================================================

  function markCurrentStepAsRead() {

    const id =
      getCurrentEntryId();


    if (!id) {
      return;
    }


    if (!readFlags.includes(id)) {

      readFlags.push(id);


      try {

        localStorage.setItem(
          'floriography_read_flags',
          JSON.stringify(readFlags)
        );

      } catch (e) {

        console.error(
          "既読データの保存に失敗しました。",
          e
        );
      }
    }
  }


  // =========================================================
  // タイマー停止
  // =========================================================

  function stopTextTimer() {

    if (timerId) {

      clearInterval(timerId);

      timerId = null;
    }


    isTyping = false;
  }

// =========================================================
// AUTO停止
// =========================================================

function stopAutoMode() {

  isAutoMode = false;

  if (autoTimerId) {

    clearTimeout(autoTimerId);

    autoTimerId = null;
  }


  const autoBtn =
    document.getElementById(
      'auto-btn'
    );


  if (autoBtn) {

    autoBtn.classList.remove(
      'active-auto'
    );
  }
}


// =========================================================
// AUTO待機時間を文章の長さから計算
// =========================================================

function getAutoWaitTime(text) {

  const length = text.length;

  const calculated =
    autoBaseWait +
    length * autoPerCharWait;

  return Math.min(
    calculated,
    autoMaxWait
  );
}

  // =========================================================
  // SKIP停止
  // =========================================================

  function stopSkipMode() {

    isSkipMode = false;


    if (skipTimerId) {

      clearTimeout(skipTimerId);

      skipTimerId = null;
    }


    const skipBtn =
      document.getElementById(
        'skip-btn'
      );


    if (skipBtn) {

      skipBtn.classList.remove(
        'active-skip'
      );
    }
  }


  // =========================================================
  // 会話画面生成
  // =========================================================

function renderDialogueScreen() {

  // プロローグを含め、会話画面では常にMENUを表示
  menuContainer.classList.add('active');
  menuContainer.classList.remove('hidden');


  gameContainer.innerHTML = `

        <button

          type="button"
          class="auto-btn"

        >
          AUTO
        </button>


        <button
          type="button"
          class="skip-btn"
          id="skip-btn"
        >
          SKIP
        </button>


        <div
          class="character-name"
          id="char-name"
        ></div>


        <div
          id="dialogue-text"
        ></div>


        <div
          class="next-mark"
          id="next-btn"
        >
          ▽
        </div>

      </div>


    </div>
  `;



  // =========================================================
  // 会話ボックス全体クリックで次へ
  // =========================================================

  const dialogueBox =
    document.getElementById('dialogue-box');


  dialogueBox.addEventListener(
    'click',
    (e) => {

      // SKIP・AUTO・×を押した場合は会話送りしない
      if (
        e.target.closest('#skip-btn') ||
        e.target.closest('#auto-btn') ||
        e.target.closest('#close-btn')
      ) {
        return;
      }


      // SKIP中なら解除
      if (isSkipMode) {
        stopSkipMode();
      }


      // AUTO中なら解除
      if (isAutoMode) {
        stopAutoMode();
      }


      nextDialogue();
    }
  );


  // =========================================================
  // SKIPボタン
  // =========================================================

  document
    .getElementById('skip-btn')
    .addEventListener(
      'click',
      (e) => {

        e.stopPropagation();


        if (!isSkipMode) {

          // 現在の行が未読ならSKIP不可
          if (!isCurrentStepRead()) {

            showMessage(
              "ここから先は未読のため、スキップできません。"
            );

            return;
          }


          // AUTO中なら解除
          if (isAutoMode) {
            stopAutoMode();
          }


          isSkipMode = true;


          const skipBtn =
            document.getElementById('skip-btn');


          if (skipBtn) {
            skipBtn.classList.add('active-skip');
          }


          nextDialogue();


        } else {

          stopSkipMode();
        }
      }
    );


  // =========================================================
  // AUTOボタン
  // =========================================================

  document
    .getElementById('auto-btn')
    .addEventListener(
      'click',
      (e) => {

        e.stopPropagation();


        // AUTO開始
        if (!isAutoMode) {

          // SKIP中なら解除
          if (isSkipMode) {
            stopSkipMode();
          }


          isAutoMode = true;


          const autoBtn =
            document.getElementById('auto-btn');


          if (autoBtn) {
            autoBtn.classList.add('active-auto');
          }


          // すでに文章全文が表示済みなら、
          // 少し待って次へ進む

    if (!isTyping) {

  const waitTime =
    getAutoWaitTime(currentText);

  autoTimerId =
    setTimeout(
      () => {

        nextDialogue();

      },
      waitTime
    );
}

        } else {

          // 再度押したらAUTO停止
          stopAutoMode();
        }
      }
    );


  bindCloseButton();
}

 // =========================================================
// 調査終了
// =========================================================

function finishInvestigation() {

  // -------------------------------------------------------
  // 調査モード終了
  // -------------------------------------------------------

  isInvestigationMode =
    false;

  currentInvestigationId =
    null;


  // -------------------------------------------------------
  // タブレットBGMが流れている場合だけ
  // 元のBGMへ戻す
  // -------------------------------------------------------

  if (
    currentBgm ===
    TABLET_BGM
  ) {

    if (
      previousBgmBeforeTablet
    ) {

      playBgm(
        previousBgmBeforeTablet
      );

    } else {

      stopBgm();
    }
  }


  previousBgmBeforeTablet =
    null;


  // -------------------------------------------------------
  // シナリオを調査コマンドの次へ進める
  // -------------------------------------------------------

  currentStep++;


  // -------------------------------------------------------
  // 通常ADVへ戻る
  // -------------------------------------------------------

  renderDialogueScreen();

  updateDialogue();
}


// =========================================================
// 調査結果
// =========================================================

function startInvestigationResult(
  targetId
) {

  const investigation =
    investigationData[
      currentInvestigationId
    ];


  if (!investigation) {
    return;
  }


  const target =
    investigation.targets[
      targetId
    ];


  if (!target) {
    return;
  }


  investigationFlags[
    target.flag
  ] = true;


  if (
    target.findStudentBook
  ) {

    investigationFlags
      .studentBookFound =
      true;
  }


  let resultIndex =
    0;


  function showNextResult() {

    const data =
      target.result[
        resultIndex
      ];


    if (!data) {

      renderInvestigationScreen(
        currentInvestigationId
      );

      return;
    }


    showInvestigationResultEntry(
      data,
      () => {

        resultIndex++;

        showNextResult();

      }
    );
  }


  showNextResult();
}


// =========================================================
// 調査中タイプライター停止
// =========================================================

function stopInvestigationTextTimer() {

  if (investigationTimerId) {

    clearInterval(
      investigationTimerId
    );

    investigationTimerId =
      null;
  }


  isInvestigationTyping =
    false;
}


// =========================================================
// 調査中タイプライター
// =========================================================

function typeWriterInvestigation(
  text,
  textElement
) {

  stopInvestigationTextTimer();


  investigationCurrentText =
    text;


  textElement.textContent =
    "";


  let index =
    0;


  isInvestigationTyping =
    true;


  investigationTimerId =
    setInterval(
      () => {

        // 画面切り替えなどで
        // 要素が消えていた場合
        if (
          !document.body.contains(
            textElement
          )
        ) {

          stopInvestigationTextTimer();

          return;
        }


        textElement.textContent +=
          text[index];


        index++;


        if (
          index >=
          text.length
        ) {

          stopInvestigationTextTimer();
        }

      },

      textSpeed
    );
}


// =========================================================
// 調査結果1行表示
// =========================================================

function showInvestigationResultEntry(
  data,
  onNext
) {

  const screen =
    document.getElementById(
      'investigation-screen'
    );


  if (!screen) {
    return;
  }


  // 念のため前の調査用タイマーを停止
  stopInvestigationTextTimer();


  // 調査用メニュー類を隠す
  screen
    .querySelectorAll(
      '.investigation-menu, .investigation-tablet-panel, .tablet-home-panel, .tablet-function-menu, .investigation-point'
    )
    .forEach(
      element => {
        element.remove();
      }
    );


  const resultBox =
    document.createElement(
      'div'
    );


  resultBox.className =
    'investigation-result-box';


  const displayName =
    replaceNameTags(
      data.name
    ).trim();


  const displayText =
    replaceNameTags(
      data.text
    );


  // -------------------------------------------------------
  // テキストボックスを先に作る
  // 本文はまだ入れない
  // -------------------------------------------------------

  resultBox.innerHTML = `

    ${
      displayName

        ? `
          <div
            class="investigation-result-name"
          >
            ${displayName}
          </div>
        `

        : ''
    }

    <div
      class="investigation-result-text"
    ></div>

    <div
      class="investigation-result-next"
    >
      ▽
    </div>
  `;


  screen.appendChild(
    resultBox
  );


  const textElement =
    resultBox.querySelector(
      '.investigation-result-text'
    );


  if (!textElement) {
    return;
  }


  // -------------------------------------------------------
  // 通常会話と同じ速度でタイプライター表示
  // -------------------------------------------------------

  typeWriterInvestigation(
    displayText,
    textElement
  );


  // -------------------------------------------------------
  // テキストボックスクリック
  // -------------------------------------------------------

  resultBox.addEventListener(
    'click',
    () => {

      // -----------------------------------------------
      // まだ文字表示中なら、
      // 次へ進まず全文を一気に表示
      // -----------------------------------------------

      if (
        isInvestigationTyping
      ) {

        stopInvestigationTextTimer();


        textElement.textContent =
          investigationCurrentText;


        return;
      }


      // -----------------------------------------------
      // 全文表示済みなら次の台詞へ
      // -----------------------------------------------

      resultBox.remove();


      if (onNext) {
        onNext();
      }

    }
  );
}


// =========================================================
// 調査中コマンド
// =========================================================

function runInvestigationCommand(
  command,
  onComplete
) {

  if (!command) {

    if (onComplete) {
      onComplete();
    }

    return;
  }


  // -------------------------------------------------------
  // 調査中会話
  // -------------------------------------------------------

  if (
    command.type ===
    "investigationDialogue"
  ) {

    showInvestigationResultEntry(
      {
        name:
          command.name ?? "",

        text:
          command.text ?? ""
      },

      () => {

        if (onComplete) {
          onComplete();
        }

      }
    );

    return;
  }


  console.warn(
    "未対応の調査コマンドです:",
    command.type
  );


  if (onComplete) {
    onComplete();
  }
}

// =========================================================
// 調査中コマンドを連続実行
// =========================================================

function runInvestigationCommands(
  commands,
  onComplete

 function nextDialogue() {

  // =========================================================
  // 次へ
  // =========================================================

  currentStep++;


  // =========================================================
  // シーン終了
  // =========================================================

  if (
    currentStep >=
    currentScenario.length
  ) {

    stopSkipMode();
    stopAutoMode();


    if (
      currentScene === "prologue"
    ) {

      showNameScene();

    return;

    !isCurrentStepRead()
  ) {

    stopSkipMode();
  }


  updateDialogue();

        textElement.textContent +=
          text[index];


        index++;

  // =========================================================
  // 名前タグ置換
  // =========================================================

  function replaceNameTags(text) {

    if (!text) {
      return "";
    }


    const fullName =
      playerLastName +
      playerFirstName;


    return text

      .replace(
        /[{｛](LAST_NAME|姓)[}｝]/g,
        playerLastName
      )

      .replace(
        /[{｛](FIRST_NAME|名)[}｝]/g,
        playerFirstName
      )

      .replace(
        /[{｛](NAME|フルネーム)[}｝]/g,
        fullName
      );
  }

  // =========================================================
  // バックログ追加
  // =========================================================

  function addDialogueToHistory(
    rawName,
    rawText
  ) {

    const name =
      replaceNameTags(
        rawName
      ).trim();


    const text =
      replaceNameTags(
        rawText
      );


    const last =
      dialogueHistory[
        dialogueHistory.length - 1
      ];


    // 同じ文章の二重登録防止
    if (
      last &&
      last.name === name &&
      last.text === text
    ) {

      return;
    }


    dialogueHistory.push({
      name,
      text
    });
  }

 function openSlotModal(mode) {

  const modalOverlay =
    document.getElementById(
      'slot-modal-overlay'
    );

  const modalHeader =
    document.getElementById(
      'slot-modal-header'
    );

  const slotList =
    document.getElementById(
      'slot-list'
    );


  modalHeader.textContent =
    mode === 'save'
      ? 'セーブするSLOTを選択'
      : 'ロードするSLOTを選択';


  slotList.innerHTML = '';


  // =====================================================
  // 第一段階：SLOTページを表示
  // =====================================================

  for (
    let page = 1;
    page <= SAVE_PAGE_COUNT;
    page++
  ) {

    const pageItem =
      document.createElement('div');

    pageItem.className =
      'slot-item';


    // このページにセーブデータがあるか確認
    let savedCount = 0;

    for (
      let sub = 1;
      sub <= SLOTS_PER_PAGE;
      sub++
    ) {

      const actualSlot =
        (page - 1) *
        SLOTS_PER_PAGE +
        sub;

      if (
        localStorage.getItem(
          `floriography_save_${actualSlot}`
        ) !== null
      ) {
        savedCount++;
      }
    }


    pageItem.innerHTML = `
      <div class="slot-info">

        <div class="slot-number">
          SLOT ${page}
        </div>

        <div class="slot-detail">
          ${savedCount} / ${SLOTS_PER_PAGE} 保存済み
        </div>

      </div>
    `;


    pageItem.addEventListener(
      'click',
      () => {

        openSavePage(
          mode,
          page
        );
      }
    );


    slotList.appendChild(
      pageItem
    );
  }


  modalOverlay
    .classList
    .add('active');
}

function openSavePage(
  mode,
  page
) {

  const modalHeader =
    document.getElementById(
      'slot-modal-header'
    );

  const slotList =
    document.getElementById(
      'slot-list'
    );


  modalHeader.textContent =
    mode === 'save'
      ? `SLOT ${page}：セーブ先を選択`
      : `SLOT ${page}：ロードするデータを選択`;


  slotList.innerHTML = '';


  // =====================================================
  // 第二段階：ページ内のセーブ枠
  // =====================================================

  for (
    let subSlot = 1;
    subSlot <= SLOTS_PER_PAGE;
    subSlot++
  ) {

    const actualSlot =
      (page - 1) *
      SLOTS_PER_PAGE +
      subSlot;


    const rawData =
      localStorage.getItem(
        `floriography_save_${actualSlot}`
      );


    let saveData = null;


    if (rawData) {

      try {

        saveData =
          JSON.parse(rawData);

      } catch (e) {

        console.error(
          `セーブデータ ${actualSlot} が壊れています。`,
          e
        );
      }
    }


    const slotItem =
      document.createElement(
        'div'
      );

    slotItem.className =
      'slot-item';


    if (saveData) {

      const saveLastName =
        saveData.playerLastName
        ?? "七條";


      const saveFirstName =
        saveData.playerFirstName
        ?? "七星";


const saveChapterName =
  saveData.chapterName
  ?? sceneInfo[saveData.scene]?.name
  ?? "不明な章";


      slotItem.innerHTML = `

        <div class="slot-info">

          <div class="slot-number">
            SAVE ${subSlot}
          </div>

          <div class="slot-detail">
            ${saveChapterName}
            （${saveLastName}${saveFirstName}）
          </div>

        </div>

        <div class="slot-date">
          ${saveData.timestamp ?? ""}
        </div>
      `;


    } else {

      slotItem.innerHTML = `

        <div class="slot-info">

          <div class="slot-number">
            SAVE ${subSlot}
          </div>

          <div
            class="slot-detail"
            style="color: #666;"
          >
            データなし
          </div>

        </div>
      `;
    }


    slotItem.addEventListener(
      'click',
      () => {

if (mode === 'save') {

  // すでにデータがある場合
  if (saveData) {

    showConfirmMessage(
      "本当にセーブデータを上書き保存しますか？",
      () => {

        saveGame(
          actualSlot
        );

        closeSlotModal();
      }
    );


  } else {

    // 空きスロットなら確認なしで保存
    saveGame(
      actualSlot
    );

    closeSlotModal();
  }


} else {

  if (saveData) {

    loadGame(
      actualSlot
    );

    closeSlotModal();


  } else {

    showMessage(
      'データが存在しません。'
    );
  }
}
      }
    );


    slotList.appendChild(
      slotItem
    );
  }


  // =====================================================
  // SLOT一覧へ戻るボタン
  // =====================================================

  const backButton =
    document.createElement(
      'button'
    );

  backButton.className =
    'sidebar-btn';

  backButton.textContent =
    '← SLOT一覧に戻る';


  backButton.addEventListener(
    'click',
    () => {

      openSlotModal(
        mode
      );
    }
  );


  slotList.appendChild(
    backButton
  );
}


// =========================================================
// セーブ／ロードモーダルを閉じる
// =========================================================

function closeSlotModal() {

  document
    .getElementById(
      'slot-modal-overlay'
    )
    .classList
    .remove('active');
}


  // =========================================================
  // セーブ
  // =========================================================

  function saveGame(slotIndex) {

    const now =
      new Date();


    const timeStr =

      `${now.getFullYear()}/` +

      `${now.getMonth() + 1}/` +

      `${now.getDate()} ` +

      `${now.getHours()}:` +

      `${String(
        now.getMinutes()
      ).padStart(
        2,
        '0'
      )}`;


    const currentEntryId =
      getCurrentEntryId();


    const saveData = {


      // セーブデータ形式
      version: 5,


      scene:
        currentScene,


      step:
        currentStep,


      // 将来的なシナリオ変更に備えIDも保存
      entryId:
        currentEntryId,


      playerLastName:
        playerLastName,


      playerFirstName:
        playerFirstName,


  chapterName:
  getCurrentChapterName(),


      currentBackground:
      currentBackground,

currentBgm:
  currentBgm,

      timestamp:
        timeStr,


      dialogueHistory:
        dialogueHistory,



   // -------------------------------------------------------
  // 調査状態
  // -------------------------------------------------------

  investigationFlags:
    {
      ...investigationFlags
    },


  // -------------------------------------------------------
  // タブレットアプリ解放状態
  // -------------------------------------------------------

  tabletAppUnlocked:
    {
      ...tabletAppUnlocked
    }

};



    try {


      localStorage.setItem(
        `floriography_save_${slotIndex}`,
        JSON.stringify(
          saveData
        )
      );


      showMessage(
        `スロット ${slotIndex} にセーブしました。`
      );


    } catch (e) {


      console.error(
        "セーブに失敗しました。",
        e
      );


      showMessage(
        "セーブに失敗しました。"
      );
    }
  }


  // =========================================================
  // ロード
  // =========================================================

async function loadGame(slotIndex) {

    const rawData =
      localStorage.getItem(
        `floriography_save_${slotIndex}`
      );


    if (!rawData) {
      return;
    }


    let saveData;


    try {


      saveData =
        JSON.parse(
          rawData
        );


    } catch (e) {


      console.error(
        "セーブデータの読み込みに失敗しました。",
        e
      );


      showMessage(
        "セーブデータを読み込めませんでした。"
      );


      return;
    }


    stopSkipMode();
    stopTextTimer();
    stopAutoMode();


    // -------------------------------------------------------
    // シーン復元
    // -------------------------------------------------------

if (saveData.scene) {

  currentScene =
    saveData.scene;

} else {

  // 古いセーブデータとの互換用
  currentScene =
    getSceneIdFromChapterName(
      saveData.chapterName
    );
}


    // -------------------------------------------------------
    // 名前復元
    // -------------------------------------------------------

    playerLastName =
      saveData.playerLastName
      ?? "七條";


    playerFirstName =
      saveData.playerFirstName
      ?? "七星";


// -------------------------------------------------------
// 調査・タブレット状態を一度初期化
// -------------------------------------------------------

resetInvestigationAndTabletState();


// -------------------------------------------------------
// 調査状態を復元
// -------------------------------------------------------

if (
  saveData.investigationFlags &&
  typeof saveData.investigationFlags ===
    "object"
) {

  Object.assign(
    investigationFlags,
    saveData.investigationFlags
  );
}


// -------------------------------------------------------
// タブレットアプリ解放状態を復元
// -------------------------------------------------------

if (
  saveData.tabletAppUnlocked &&
  typeof saveData.tabletAppUnlocked ===
    "object"
) {

  Object.assign(
    tabletAppUnlocked,
    saveData.tabletAppUnlocked
  );
}


    // -------------------------------------------------------
    // バックログ復元
    // -------------------------------------------------------

    dialogueHistory =
      Array.isArray(
        saveData.dialogueHistory
      )

        ? saveData.dialogueHistory

        : [];


    const currentScenario =
      getCurrentScenario();


    // -------------------------------------------------------
    // 新方式：entryIdから位置を探す
    // -------------------------------------------------------

    if (saveData.entryId) {


      const foundIndex =
        currentScenario.findIndex(
          item =>
            item.id ===
            saveData.entryId
        );


      if (foundIndex !== -1) {


        currentStep =
          foundIndex;


      } else {


        currentStep =
          Number.isInteger(
            saveData.step
          )

            ? saveData.step

            : 0;
      }


    } else {


      // 旧セーブデータ
      currentStep =
        Number.isInteger(
          saveData.step
        )

          ? saveData.step

          : 0;
    }


    // -------------------------------------------------------
    // 範囲外防止
    // -------------------------------------------------------

    if (currentStep < 0) {

      currentStep = 0;
    }


    if (
      currentStep >=
      currentScenario.length
    ) {

      currentStep =
        currentScenario.length - 1;
    }


// -------------------------------------------------------
// 背景復元
// -------------------------------------------------------

changeBackground(
  saveData.currentBackground ?? null
);


// -------------------------------------------------------
// BGM復元
// -------------------------------------------------------

if (
  saveData.currentBgm
) {

  await playBgm(
    saveData.currentBgm
  );

} else {

  stopBgm();
}


// -------------------------------------------------------
// 会話画面復元
// -------------------------------------------------------

renderDialogueScreen();

updateDialogue();


// -------------------------------------------------------
// フェード解除
// -------------------------------------------------------

gameContainer.classList.remove(
  'fade-out'
);

}


  // =========================================================
  // UIイベント
  // =========================================================

  function initUIEvents() {

    const menuToggleBtn =
      document.getElementById(
        'menu-toggle-btn'
      );


    const sidebarOverlay =
      document.getElementById(
        'sidebar-overlay'
      );


    const sidebar =
      document.getElementById(
        'sidebar'
      );


    const sidebarCloseBtn =
      document.getElementById(
        'sidebar-close-btn'
      );


    // -------------------------------------------------------
    // MENUを閉じる
    // -------------------------------------------------------

    const closeSidebar =
      () => {


        sidebarOverlay
          .classList
          .remove('active');


        sidebar
          .classList
          .remove('open');
      };


    // -------------------------------------------------------
    // MENU
    // -------------------------------------------------------

menuToggleBtn
  .addEventListener(
    'click',
    () => {

      // AUTO中なら解除
      if (isAutoMode) {
        stopAutoMode();
      }

      // SKIP中なら解除
      if (isSkipMode) {
        stopSkipMode();
      }

      sidebarOverlay
        .classList
        .add('active');

      sidebar
        .classList
        .add('open');
    }
  );

    sidebarCloseBtn
      .addEventListener(
        'click',
        closeSidebar
      );


    sidebarOverlay
      .addEventListener(
        'click',
        closeSidebar
      );


    // -------------------------------------------------------
    // Backlog
    // -------------------------------------------------------

document
  .getElementById(
    'sidebar-log-btn'
  )
  .addEventListener(
    'click',
    () => {

      stopAutoMode();
      stopSkipMode();

      closeSidebar();

      openLogModal();
    }
  );


    // -------------------------------------------------------
    // Save
    // -------------------------------------------------------

    document
      .getElementById(
        'sidebar-save-btn'
      )
      .addEventListener(
        'click',
        () => {

          stopAutoMode();
          stopSkipMode();
      

          closeSidebar();

          openSlotModal(
            'save'
          );
        }
      );


    // -------------------------------------------------------
    // Load
    // -------------------------------------------------------

    document
      .getElementById(
        'sidebar-load-btn'
      )
      .addEventListener(
        'click',
        () => {

          stopAutoMode();
          stopSkipMode();


          closeSidebar();

          openSlotModal(
            'load'
          );
        }
      );


    // -------------------------------------------------------
    // Config
    // -------------------------------------------------------

    document
      .getElementById(
        'sidebar-config-btn'
      )
      .addEventListener(
        'click',
        () => {

          stopAutoMode();
          stopSkipMode();


          closeSidebar();

          openConfigModal();
        }
      );


// -------------------------------------------------------
// Fullscreen
// -------------------------------------------------------

document
  .getElementById(
    'sidebar-fullscreen-btn'
  )
  .addEventListener(
    'click',
    () => {

      stopAutoMode();
      stopSkipMode();

      closeSidebar();

      toggleFullscreen();
    }
  );


    // -------------------------------------------------------
    // Back to title
    // -------------------------------------------------------

document
  .getElementById(
    'sidebar-title-btn'
  )
  .addEventListener(
    'click',
    () => {

      stopAutoMode();
      stopSkipMode();

      closeSidebar();


      showConfirmMessage(
        "本当にタイトルに戻りますか？",
        () => {

          stopSkipMode();
          stopTextTimer();
          stopAutoMode();


          gameContainer.classList.add(
            'fade-out'
          );


          setTimeout(
            () => {

              showTitleScreen();


              gameContainer
                .classList
                .remove(
                  'fade-out'
                );

            },
            400
          );

        }
      );
    }
  );   

    // -------------------------------------------------------
    // モーダル閉じる
    // -------------------------------------------------------

    document
      .getElementById(
        'slot-close-btn'
      )
      .addEventListener(
        'click',
        closeSlotModal
      );


    document
      .getElementById(
        'log-close-btn'
      )
      .addEventListener(
        'click',
        closeLogModal
      );


    document
      .getElementById(
        'config-close-btn'
      )
      .addEventListener(
        'click',
        closeConfigModal
      );

// -------------------------------------------------------
// 共通メッセージウィンドウを閉じる
// -------------------------------------------------------

document
  .getElementById(
    'message-ok-btn'
  )
  .addEventListener(
    'click',
    closeMessage
  );

document
  .getElementById(
    'message-yes-btn'
  )
  .addEventListener(
    'click',
    () => {

      const action =
        confirmYesAction;

      closeMessage();

      if (action) {
        action();
      }
    }
  );


document
  .getElementById(
    'message-no-btn'
  )
  .addEventListener(
    'click',
    closeMessage
  );


    // -------------------------------------------------------
    // テキスト速度
    // -------------------------------------------------------

    const speedSlider =
      document.getElementById(
        'text-speed-slider'
      );


   speedSlider.addEventListener(
  'input',
  (e) => {

    textSpeed =
      parseInt(
        e.target.value,
        10
      );

    updateSpeedDisplay(
      textSpeed
    );


    // 設定を保存
    try {

      localStorage.setItem(
        'floriography_text_speed',
        String(textSpeed)
      );

    } catch (err) {

      console.error(
        "テキスト速度設定の保存に失敗しました。",
        err
      );
    }
  }
);


// -------------------------------------------------------
// BGM音量
// -------------------------------------------------------

const bgmVolumeSlider =
  document.getElementById(
    'bgm-volume-slider'
  );


if (bgmVolumeSlider) {

  bgmVolumeSlider.addEventListener(
    'input',
    (e) => {

      const sliderValue =
        parseInt(
          e.target.value,
          10
        );


      // 0～100 → 0.0～1.0
      bgmVolume =
        sliderValue / 100;


      // 現在再生中のBGMにも即反映
      if (bgmGainNode) {

        bgmGainNode.gain.value =
          bgmVolume;
      }


      updateBgmVolumeDisplay(
        sliderValue
      );


      // 設定を保存
      try {

        localStorage.setItem(
          'floriography_bgm_volume',
          String(bgmVolume)
        );

      } catch (err) {

        console.error(
          "BGM音量設定の保存に失敗しました。",
          err
        );
      }

    }
  );
}

    // -------------------------------------------------------
    // 会話枠を再表示
    // -------------------------------------------------------

    document.body.addEventListener(
      'click',
      (e) => {


        const dialogueBox =
          document.getElementById(
            'dialogue-box'
          );


        if (
          dialogueBox &&
          dialogueBox
            .classList
            .contains(
              'hidden'
            )
        ) {


          dialogueBox
            .classList
            .remove(
              'hidden'
            );


          menuContainer
            .classList
            .remove(
              'hidden'
            );


          e.stopPropagation();
        }

      },
      true
    );

// -------------------------------------------------------
// Enterキーで会話を進める
// -------------------------------------------------------

document.addEventListener(
  'keydown',
  (e) => {

    // Enterキー以外は無視
    if (e.key !== 'Enter') {
      return;
    }

    // 名前入力欄など、入力中なら反応させない
    const activeElement = document.activeElement;

    if (
      activeElement &&
      (
        activeElement.tagName === 'INPUT' ||
        activeElement.tagName === 'TEXTAREA'
      )
    ) {
      return;
    }

    // MENUが開いている場合は反応させない
    const sidebar =
      document.getElementById('sidebar');

    if (
      sidebar &&
      sidebar.classList.contains('open')
    ) {
      return;
    }

    // セーブ/ロード画面が開いている場合は反応させない
    const slotModal =
      document.getElementById('slot-modal-overlay');

    if (
      slotModal &&
      slotModal.classList.contains('active')
    ) {
      return;
    }

    // バックログが開いている場合は反応させない
    const logModal =
      document.getElementById('log-modal-overlay');

    if (
      logModal &&
      logModal.classList.contains('active')
    ) {
      return;
    }

    // CONFIGが開いている場合は反応させない
    const configModal =
      document.getElementById('config-modal-overlay');

    if (
      configModal &&
      configModal.classList.contains('active')
    ) {
      return;
    }

// メッセージウィンドウが開いている場合
const messageOverlay =
  document.getElementById(
    'message-overlay'
  );

if (
  messageOverlay &&
  messageOverlay.classList.contains(
    'active'
  )
) {
  return;
}


// -------------------------------------------------------
// 調査中テキストボックス
// -------------------------------------------------------

const investigationResultBox =
  document.querySelector(
    '.investigation-result-box'
  );


if (investigationResultBox) {

  investigationResultBox.click();

  return;
}


    // 会話画面が存在しない場合は反応させない
    const dialogueBox =
      document.getElementById('dialogue-box');

    if (!dialogueBox) {
      return;
    }

    // 会話枠が非表示なら反応させない
    if (
      dialogueBox.classList.contains('hidden')
    ) {
      return;
    }

    // AUTO中なら解除
    if (isAutoMode) {
      stopAutoMode();
    }

    // SKIP中なら解除
    if (isSkipMode) {
      stopSkipMode();
    }

    nextDialogue();
  }
);


  }


  // =========================================================
  // 起動
  // =========================================================

  window.addEventListener(
  'DOMContentLoaded',
  () => {

    resizeGameScreen();

    initUIEvents();


    // 保存された速度をスライダーにも反映
    const speedSlider =
      document.getElementById(
        'text-speed-slider'
      );

    if (speedSlider) {
      speedSlider.value =
        String(textSpeed);
    }


    updateSpeedDisplay(
      textSpeed
    );


// -------------------------------------------------------
// BGM音量設定を画面へ反映
// -------------------------------------------------------

const bgmVolumeSlider =
  document.getElementById(
    'bgm-volume-slider'
  );


const bgmVolumePercent =
  Math.round(
    bgmVolume * 100
  );


if (bgmVolumeSlider) {

  bgmVolumeSlider.value =
    String(
      bgmVolumePercent
    );
}


updateBgmVolumeDisplay(
  bgmVolumePercent
);


    showTitleScreen();


    // 初期画面の生成が終わってから表示
    requestAnimationFrame(
      () => {

        gameStage.style.opacity =
          '1';

      }
    );

  }
);


   window.addEventListener(
  'resize',
  resizeGameScreen
);

</script>


 </body>
