const GAME_WIDTH = 1280;
const GAME_HEIGHT = 720;

function resizeGameScreen() {

  const viewportWidth =
    window.innerWidth;

  const viewportHeight =
    window.innerHeight;


  const scaleX =
    viewportWidth / GAME_WIDTH;

  const scaleY =
    viewportHeight / GAME_HEIGHT;


  // 縦横とも画面内に収まる最大倍率
  const scale =
    Math.min(
      scaleX,
      scaleY
    );


  gameStage.style.transform =
    `translate(-50%, -50%) scale(${scale})`;
}

// =========================================================
// キャラクターパラメータ増減
// 0～100の範囲に収める
// =========================================================

function addCharacterParam(
  characterId,
  paramName,
  amount
) {

  const character =
    characterParams[
      characterId
    ];


  if (!character) {

    console.warn(
      "存在しないキャラクターです:",
      characterId
    );

    return;
  }


  if (
    !(paramName in character)
  ) {

    console.warn(
      "存在しないパラメータです:",
      characterId,
      paramName
    );

    return;
  }


  const newValue =
    character[
      paramName
    ] + amount;


  character[
    paramName
  ] =
    Math.max(
      0,
      Math.min(
        100,
        newValue
      )
    );
}



// =========================================================
// キャラクターパラメータ初期化

  Object.keys(
    DEFAULT_CHARACTER_PARAMS

// =========================================================
// 選択肢のパラメータ変化をまとめて適用
// =========================================================

function applyChoiceEffects(
  effects
) {

  if (
    !Array.isArray(
      effects
    )
  ) {

    return;
  }


  effects.forEach(
    effect => {

      if (
        !effect ||
        !effect.character ||
        !effect.param
      ) {

        return;
      }


      addCharacterParam(
        effect.character,
        effect.param,
        effect.amount ?? 0
      );

    }
  );
}



// =========================================================
// シナリオIDから現在位置を移動
// =========================================================

function jumpToScenarioId(
  targetId
) {

  const currentScenario =
    getCurrentScenario();


  const targetIndex =
    currentScenario.findIndex(
      item =>
        item.id ===
        targetId
    );


  if (
    targetIndex === -1
  ) {

    console.warn(
      "移動先のシナリオIDが見つかりません:",
      targetId
    );

    return false;
  }


  currentStep =
    targetIndex;


  updateDialogue();


  return true;
}



// =========================================================
// 選択肢表示

function showChoice(
  data
) {

  stopSkipMode();
  stopAutoMode();
  stopTextTimer();


  const gameScreen =
    document.getElementById(
      'game-screen'
    );


  if (!gameScreen) {

    console.warn(
      "選択肢を表示する画面が見つかりません。"
    );

    return;
  }


  const oldChoiceBox =
    document.getElementById(
      'choice-box'
    );


  if (oldChoiceBox) {

    oldChoiceBox.remove();
  }


  const choiceBox =
    document.createElement(
      'div'
    );


  choiceBox.id =
    'choice-box';

  choiceBox.className =
    'choice-box';


  const choices =
    Array.isArray(
      data.choices
    )
      ? data.choices
      : [];


  choices.forEach(
    choice => {

      const button =
        document.createElement(
          'button'
        );


      button.type =
        'button';

      button.className =
        'choice-btn';

      button.textContent =
        choice.text ?? "選択肢";


      button.addEventListener(
        'click',
        () => {

          applyChoiceEffects(
            choice.effects
          );


          choiceBox.remove();


          if (
            choice.nextId
          ) {

            jumpToScenarioId(
              choice.nextId
            );

          } else {

            currentStep++;

            updateDialogue();
          }

        }
      );


      choiceBox.appendChild(
        button
      );

    }
  );


  gameScreen.appendChild(
    choiceBox
  );
}

  kyoya: {

    possessiveness: 60

  kezi: {

// =========================================================
// キャラクター別 B / C エンディング判定
// =========================================================

function getCharacterEndingType(
  characterId
) {

  const params =
    characterParams[
      characterId
    ];


  const threshold =
    CHARACTER_ENDING_THRESHOLDS[
      characterId
    ];


  if (
    !params ||
    !threshold
  ) {

    console.warn(
      "エンディング判定情報がありません:",
      characterId
    );

    return null;
  }


  const paramNames =
    Object.keys(
      threshold
    );


  const allPassed =
    paramNames.every(
      paramName => {

        return (
          params[paramName] >=
          threshold[paramName]
        );

      }
    );


  return allPassed
    ? "C"
    : "B";
}

// =========================================================
// BGM音量
// 0.0 ～ 1.0
// =========================================================

let bgmVolume =
  0.5;


try {

  const savedBgmVolume =
    localStorage.getItem(
      'floriography_bgm_volume'
    );


  if (
    savedBgmVolume !== null
  ) {

    const parsedVolume =
      parseFloat(
        savedBgmVolume
      );


    if (
      !Number.isNaN(
        parsedVolume
      )
    ) {

      bgmVolume =
        Math.min(
          1,
          Math.max(
            0,
            parsedVolume
          )
        );
    }
  }

} catch (e) {

  console.error(
    "BGM音量設定の読み込みに失敗しました。",
    e
  );
}


// 一度読み込んだBGMを保存
const bgmBufferCache =
  new Map();


// 同じファイルを同時に何度も読み込まないための記録
const bgmLoadingPromises =
  new Map();


// 古い再生要求が後から実行されるのを防ぐ
let bgmActionId = 0;


// =========================================================
// AudioContextを準備
// =========================================================

function getAudioContext() {

  if (!audioContext) {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    audioContext =
      new AudioContextClass();


    bgmGainNode =
      audioContext.createGain();

bgmGainNode.gain.value =
  bgmVolume;

    bgmGainNode.connect(
      audioContext.destination
    );
  }

  return audioContext;
}


// =========================================================
// BGMファイルをメモリへ読み込む
// =========================================================

async function loadBgmBuffer(fileName) {

  // すでに読み込み済み
  if (
    bgmBufferCache.has(
      fileName
    )
  ) {

    return bgmBufferCache.get(
      fileName
    );
  }


  // 現在読み込み中なら、その処理を待つ
  if (
    bgmLoadingPromises.has(
      fileName
    )
  ) {

    return bgmLoadingPromises.get(
      fileName
    );
  }


  const context =
    getAudioContext();


  const loadingPromise =
    fetch(
      `audio/${fileName}`
    )
      .then(
        response => {

          if (!response.ok) {

            throw new Error(
              `BGMファイルを取得できませんでした: ${fileName}`
            );
          }

          return response.arrayBuffer();
        }
      )
      .then(
        arrayBuffer =>
          context.decodeAudioData(
            arrayBuffer
          )
      )
      .then(
        audioBuffer => {

          bgmBufferCache.set(
            fileName,
            audioBuffer
          );

          bgmLoadingPromises.delete(
            fileName
          );

          return audioBuffer;
        }
      )
      .catch(
        error => {

          bgmLoadingPromises.delete(
            fileName
          );

          throw error;
        }
      );


  bgmLoadingPromises.set(
    fileName,
    loadingPromise
  );


  return loadingPromise;
}

      "BGMの準備に失敗しました:",

  }
}

// =========================================================
// シナリオIDチェック
// =========================================================

function checkScenarioIds() {

  const usedIds =
    new Map();


  const duplicateIds =
    [];


  const missingIds =
    [];


  Object.entries(
    sceneInfo
  ).forEach(
    ([sceneId, sceneData]) => {

      const scenario =
        sceneData.scenario;


      scenario.forEach(
        (item, index) => {

          // ---------------------------------------------------
          // ID未設定チェック
          // ---------------------------------------------------

          if (
            !item.id
          ) {

            missingIds.push({
              sceneId,
              index
            });

            return;
          }


          // ---------------------------------------------------
          // ID重複チェック
          // ---------------------------------------------------

          if (
            usedIds.has(
              item.id
            )
          ) {

            duplicateIds.push({
              id:
                item.id,

              first:
                usedIds.get(
                  item.id
                ),

              second: {
                sceneId,
                index
              }
            });

          } else {

            usedIds.set(
              item.id,
              {
                sceneId,
                index
              }
            );
          }

        }
      );

    }
  );


  // -------------------------------------------------------
  // 重複IDを表示
  // -------------------------------------------------------

  if (
    duplicateIds.length > 0
  ) {

    console.error(
      "シナリオIDの重複があります。",
      duplicateIds
    );

  } else {

    console.log(
      "シナリオID重複チェック：問題なし"
    );
  }


  // -------------------------------------------------------
  // ID未設定を表示
  // -------------------------------------------------------

  if (
    missingIds.length > 0
  ) {

    console.warn(
      "ID未設定のシナリオがあります。",
      missingIds
    );
  }
}

// =========================================================
// BGM再生
// =========================================================

async function playBgm(fileName) {

  // 同じ曲がすでに再生中なら何もしない
  if (
    currentBgm === fileName &&
    currentBgmSource
  ) {

    return true;
  }


  const actionId =
    ++bgmActionId;


  try {

    const context =
      getAudioContext();


    // 必要ならAudioContextを再開
    if (
      context.state ===
      "suspended"
    ) {

      await context.resume();
    }


    // 音源を読み込み
    const buffer =
      await loadBgmBuffer(
        fileName
      );


    // 読み込み中に別のBGM操作が行われていたら中止
    if (
      actionId !==
      bgmActionId
    ) {

      return false;
    }


    // 現在のBGMを停止
    if (currentBgmSource) {

      try {

        currentBgmSource.stop();

      } catch (error) {

        // すでに停止済みなら無視
      }


      currentBgmSource.disconnect();

      currentBgmSource = null;
    }


    // 新しい再生ノードを作る
    const source =
      context.createBufferSource();


    source.buffer =
      buffer;


    // シームレスループ
    source.loop =
      true;


    source.connect(
      bgmGainNode
    );


    currentBgmSource =
      source;

    currentBgm =
      fileName;


    // 曲頭から再生
    source.start(0);


    return true;


  } catch (error) {

    console.warn(
      "BGMの再生に失敗しました:",
      error
    );

    return false;
  }
}


// =========================================================
// BGM停止
// =========================================================

function stopBgm() {

  // 読み込み途中のBGMも無効化
  bgmActionId++;


  if (currentBgmSource) {

    try {

      currentBgmSource.stop();

    } catch (error) {

      // すでに停止済みなら無視
    }


    currentBgmSource.disconnect();

    currentBgmSource =
      null;
  }


  currentBgm =
    null;
}



// =========================================================
// BGMをフェードアウトしてリセット
// =========================================================

function fadeOutAndResetBgm(
  duration = 600
) {

  return new Promise(
    resolve => {

      // BGMが流れていなければ何もしない
      if (
        !currentBgmSource ||
        !bgmGainNode ||
        !audioContext
      ) {

        resolve();

        return;
      }


      const now =
        audioContext.currentTime;


      const currentVolume =
        bgmGainNode.gain.value;


      // 以前の音量変化予約を解除
      bgmGainNode.gain
        .cancelScheduledValues(
          now
        );


      // 現在音量から開始
      bgmGainNode.gain
        .setValueAtTime(
          currentVolume,
          now
        );


      // durationミリ秒かけて0へ
      bgmGainNode.gain
        .linearRampToValueAtTime(
          0,
          now + duration / 1000
        );


      setTimeout(
        () => {

          // BGMそのものを停止
          stopBgm();


          // 次にBGMを再生するときのため、
          // Configで設定された音量へ戻す
          if (bgmGainNode) {

            bgmGainNode.gain
              .cancelScheduledValues(
                audioContext.currentTime
              );


            bgmGainNode.gain.value =
              bgmVolume;
          }


          resolve();

        },

        duration
      );

    }
  );
}


// =========================================================
// 背景画像の先読み

function preloadBackground(imageName) {

  return new Promise(
    resolve => {

      const img =
        new Image();


      img.onload =
        () => {
          resolve();
        };


      img.onerror =
        () => {

          console.warn(
            "背景画像の先読みに失敗しました:",
            imageName
          );

          resolve();
        };


      img.src =
        `backgrounds/${imageName}`;
    }
  );
}

async function changeBackgroundWithFade(
  imageName,
  resetBgm = false
) {

  const overlay =
    document.getElementById(
      'scene-transition-overlay'
    );


  if (!overlay) {
    changeBackground(imageName);
    return;
  }


  // 新しい背景を先読み
  await preloadBackground(
    imageName
  );


  // 暗転開始
  overlay.classList.add(
    'active'
  );


// -------------------------------------------------------
// 必要な場合だけBGMもフェードアウト
// -------------------------------------------------------

let bgmResetPromise =
  Promise.resolve();


if (resetBgm) {

  sceneBgm =
    null;

  bgmResetPromise =
    fadeOutAndResetBgm(
      600
    );
}


// -------------------------------------------------------
// 画面暗転とBGMフェードアウトを同時に待つ
// -------------------------------------------------------

await Promise.all([
  new Promise(
    resolve =>
      setTimeout(
        resolve,
        600
      )
  ),

  bgmResetPromise
]);


// -------------------------------------------------------
// 完全暗転した時点でバックログをリセット
// -------------------------------------------------------

resetDialogueHistory();


  // 完全に暗くなってから背景変更
  changeBackground(
    imageName
  );


  // ブラウザに新背景を一度描画させる
  await new Promise(
    resolve =>
      requestAnimationFrame(
        resolve
      )
  );


  // 暗転解除
  overlay.classList.remove(
    'active'
  );
}

// =========================================================
// 現在位置までのシナリオから
// 本来のシーンBGMを取得
// =========================================================

function getSceneBgmFromScenario(
  scenario,
  step
) {

  let bgm =
    null;


  for (
    let i = 0;
    i <= step &&
    i < scenario.length;
    i++
  ) {

    const data =
      scenario[i];


    if (
      data.type ===
      "bgm"
    ) {

      bgm =
        data.file;
    }


    if (
      data.type ===
      "bgmStop"
    ) {

      bgm =
        null;
    }


    if (
      data.type ===
        "backgroundFade" &&
      data.resetBgm ===
        true
    ) {

      bgm =
        null;
    }
  }


  return bgm;
}

// =========================================================
// タブレット起動スピナー
// =========================================================

let isTabletStarting =
  false;


function showTabletLoadingSpinner() {

  return new Promise(
    resolve => {

      if (isTabletStarting) {
        resolve(false);
        return;
      }


      isTabletStarting =
        true;


      const screen =
        document.getElementById(
          'investigation-screen'
        );


      if (!screen) {

        isTabletStarting =
          false;

        resolve(false);

        return;
      }


      const oldOverlay =
        screen.querySelector(
          '.tablet-loading-overlay'
        );


      if (oldOverlay) {
        oldOverlay.remove();
      }


      const overlay =
        document.createElement(
          'div'
        );


      overlay.className =
        'tablet-loading-overlay';


      overlay.innerHTML = `
        <div
          class="tablet-loading-spinner"
        ></div>
      `;


      screen.appendChild(
        overlay
      );


      setTimeout(
        () => {

          overlay.remove();


          isTabletStarting =
            false;


          resolve(true);

        },

        300
      );

    }
  );
}


// =========================================================
// スピナー後にタブレットを開く
// =========================================================

async function openTabletWithLoading() {

  if (isTabletStarting) {
    return;
  }


  const completed =
    await showTabletLoadingSpinner();


  if (!completed) {
    return;
  }


  showTabletFunctionMenu();
}

      document.getElementById("dialogue-text");

// =========================================================
// 調査結果
// =========================================================

function startInvestigationResult(
  targetId
) {

  const investigation =
    investigationData[
      currentInvestigationId
    ];


  if (!investigation) {
    return;
  }


  const target =
    investigation.targets[
      targetId
    ];


  if (!target) {
    return;
  }


  investigationFlags[
    target.flag
  ] = true;


// -------------------------------------------------------
// 学生手帳取得
// -------------------------------------------------------

  if (
    target.findStudentBook
  ) {

    investigationFlags
      .studentBookFound =
      true;

    addItem(
      "studentBook"
    );
  }


// -------------------------------------------------------
// お守り取得
// -------------------------------------------------------

  if (
    target.findCharm
  ) {

    addItem(
      "charm"
    );
  }


// -------------------------------------------------------
// 調査結果表示
// -------------------------------------------------------

  let resultIndex =
    0;


  function showNextResult() {

    const data =
      target.result[
        resultIndex
      ];


    if (!data) {

      renderInvestigationScreen(
        currentInvestigationId
      );

      return;
    }


    showInvestigationResultEntry(
      data,
      () => {

        resultIndex++;

        showNextResult();

      }
    );
  }


  showNextResult();
}

// =========================================================
// 調査中タイプライター停止
// =========================================================

function stopInvestigationTextTimer() {

  if (investigationTimerId) {

    clearInterval(
      investigationTimerId
    );

    investigationTimerId =
      null;
  }


  isInvestigationTyping =
    false;
}


// =========================================================
// 調査中タイプライター
// =========================================================

function typeWriterInvestigation(
  text,
  textElement
) {

  stopInvestigationTextTimer();


  investigationCurrentText =
    text;


  textElement.textContent =
    "";


  let index =
    0;


  isInvestigationTyping =
    true;


  investigationTimerId =
    setInterval(
      () => {

        // 画面切り替えなどで
        // 要素が消えていた場合
        if (
          !document.body.contains(
            textElement
          )
        ) {

          stopInvestigationTextTimer();

          return;
        }


        textElement.textContent +=
          text[index];


        index++;


        if (
          index >=
          text.length
        ) {

          stopInvestigationTextTimer();
        }

      },

      textSpeed
    );
}


// =========================================================
// 調査結果1行表示
// =========================================================

function showInvestigationResultEntry(
  data,
  onNext
) {

  const screen =
    document.getElementById(
      'investigation-screen'
    );


  if (!screen) {
    return;
  }


  // 念のため前の調査用タイマーを停止
  stopInvestigationTextTimer();


// -------------------------------------------------------
// 調査中の会話表示に不要なUIを削除
// -------------------------------------------------------

screen
  .querySelectorAll(
    '.investigation-menu, ' +
    '.investigation-tablet-panel, ' +
    '.tablet-home-panel, ' +
    '.tablet-function-menu, ' +
    '.investigation-point, ' +
    '.investigation-finish-btn'
  )
  .forEach(element => {
    element.remove();
  });


  const resultBox =
    document.createElement(
      'div'
    );


  resultBox.className =
    'investigation-result-box';


  const displayName =
    replaceNameTags(
      data.name
    ).trim();


  const displayText =
    replaceNameTags(
      data.text
    );


  // -------------------------------------------------------
  // テキストボックスを先に作る
  // 本文はまだ入れない
  // -------------------------------------------------------

  resultBox.innerHTML = `

    ${
      displayName

        ? `
          <div
            class="investigation-result-name"
          >
            ${displayName}
          </div>
        `

        : ''
    }

    <div
      class="investigation-result-text"
    ></div>

    <div
      class="investigation-result-next"
    >
      ▽
    </div>
  `;


  screen.appendChild(
    resultBox
  );


  const textElement =
    resultBox.querySelector(
      '.investigation-result-text'
    );


  if (!textElement) {
    return;
  }


  // -------------------------------------------------------
  // 通常会話と同じ速度でタイプライター表示
  // -------------------------------------------------------

  typeWriterInvestigation(
    displayText,
    textElement
  );


  // -------------------------------------------------------
  // テキストボックスクリック
  // -------------------------------------------------------

  resultBox.addEventListener(
    'click',
    () => {

      // -----------------------------------------------
      // まだ文字表示中なら、
      // 次へ進まず全文を一気に表示
      // -----------------------------------------------

      if (
        isInvestigationTyping
      ) {

        stopInvestigationTextTimer();


        textElement.textContent =
          investigationCurrentText;


        return;
      }


      // -----------------------------------------------
      // 全文表示済みなら次の台詞へ
      // -----------------------------------------------

      resultBox.remove();


      if (onNext) {
        onNext();
      }

    }
  );
}


// =========================================================
// 調査中コマンド
// =========================================================

function runInvestigationCommand(
  command,
  onComplete
) {

  if (!command) {

    if (onComplete) {
      onComplete();
    }

    return;
  }


  // -------------------------------------------------------
  // 調査中会話
  // -------------------------------------------------------

  if (
    command.type ===
    "investigationDialogue"
  ) {

    showInvestigationResultEntry(
      {
        name:
          command.name ?? "",

        text:
          command.text ?? ""
      },

      () => {

        if (onComplete) {
          onComplete();
        }

      }
    );

    return;
  }


  console.warn(
    "未対応の調査コマンドです:",
    command.type
  );


  if (onComplete) {

  }
}

// =========================================================
// 調査中コマンドを連続実行
// =========================================================

function runInvestigationCommands(
  commands,
  onComplete
) {

  let index =
    0;


  function runNext() {

    const command =
      commands[index];


    if (!command) {

      if (onComplete) {
        onComplete();
      }

      return;
    }


    runInvestigationCommand(
      command,
      () => {

        index++;

        runNext();

      }
    );
  }


  runNext();
}

  // =========================================================

  // =========================================================

  function replaceNameTags(text) {

    if (!text) {
      return "";
    }


    const fullName =
      playerLastName +
      playerFirstName;


    return text

      .replace(
        /[{｛](LAST_NAME|姓)[}｝]/g,
        playerLastName
      )

      .replace(
        /[{｛](FIRST_NAME|名)[}｝]/g,
        playerFirstName
      )

      .replace(
        /[{｛](NAME|フルネーム)[}｝]/g,
        fullName
      );
  }

  // =========================================================

  function addDialogueToHistory(
    rawName,
    rawText
  ) {

    const name =
      replaceNameTags(
        rawName
      ).trim();


    const text =
      replaceNameTags(
        rawText
      );


    const last =
      dialogueHistory[
        dialogueHistory.length - 1
      ];


    // 同じ文章の二重登録防止
    if (
      last &&
      last.name === name &&
      last.text === text
    ) {

      return;
    }


    dialogueHistory.push({
      name,
      text
    });
  }

      ? 'セーブするSLOTを選択'
      : 'ロードするSLOTを選択';


  slotList.innerHTML = '';


  // =====================================================
  // 第一段階：SLOTページを表示
  // =====================================================

  for (
    let page = 1;
    page <= SAVE_PAGE_COUNT;
    page++
  ) {

    const pageItem =
      document.createElement('div');

    pageItem.className =
      'slot-item';


    // このページにセーブデータがあるか確認
    let savedCount = 0;

    for (
      let sub = 1;
      sub <= SLOTS_PER_PAGE;
      sub++
    ) {

      const actualSlot =
        (page - 1) *
        SLOTS_PER_PAGE +
        sub;

      if (
        localStorage.getItem(
          `floriography_save_${actualSlot}`
        ) !== null
      ) {
        savedCount++;
      }
    }


    pageItem.innerHTML = `
      <div class="slot-info">

        <div class="slot-number">
          SLOT ${page}
        </div>

        <div class="slot-detail">
          ${savedCount} / ${SLOTS_PER_PAGE} 保存済み
        </div>

      </div>
    `;


    pageItem.addEventListener(
      'click',
      () => {

        openSavePage(
          mode,
          page
        );
      }
    );


    slotList.appendChild(
      pageItem
    );
  }


  modalOverlay
    .classList
    .add('active');
}

function openSavePage(
  mode,
  page
) {

  const modalHeader =
    document.getElementById(
      'slot-modal-header'
    );

  const slotList =
    document.getElementById(
      'slot-list'
    );


  modalHeader.textContent =
    mode === 'save'
      ? `SLOT ${page}：セーブ先を選択`
      : `SLOT ${page}：ロードするデータを選択`;


  slotList.innerHTML = '';


  // =====================================================
  // 第二段階：ページ内のセーブ枠
  // =====================================================

  for (
    let subSlot = 1;
    subSlot <= SLOTS_PER_PAGE;
    subSlot++
  ) {

    const actualSlot =
      (page - 1) *
      SLOTS_PER_PAGE +
      subSlot;


    const rawData =
      localStorage.getItem(
        `floriography_save_${actualSlot}`
      );


    let saveData = null;


    if (rawData) {

      try {

        saveData =
          JSON.parse(rawData);

      } catch (e) {

        console.error(
          `セーブデータ ${actualSlot} が壊れています。`,
          e
        );
      }
    }


    const slotItem =
      document.createElement(
        'div'
      );

    slotItem.className =
      'slot-item';


    if (saveData) {

      const saveLastName =
        saveData.playerLastName
        ?? "七條";


      const saveFirstName =
        saveData.playerFirstName
        ?? "七星";


const saveChapterName =
  saveData.chapterName
  ?? sceneInfo[saveData.scene]?.name
  ?? "不明な章";


      slotItem.innerHTML = `

        <div class="slot-info">

          <div class="slot-number">
            SAVE ${subSlot}
          </div>

          <div class="slot-detail">
            ${saveChapterName}
            （${saveLastName}${saveFirstName}）
          </div>

        </div>

        <div class="slot-date">
          ${saveData.timestamp ?? ""}
        </div>
      `;


    } else {

      slotItem.innerHTML = `

        <div class="slot-info">

          <div class="slot-number">
            SAVE ${subSlot}
          </div>

          <div
            class="slot-detail"
            style="color: #666;"
          >
            データなし
          </div>

        </div>
      `;
    }


    slotItem.addEventListener(
      'click',
      () => {

if (mode === 'save') {

      () => {

  } else {

    // 空きスロットなら確認なしで保存
    saveGame(

} else {

  if (saveData) {

    loadGame(
      actualSlot
    );

    closeSlotModal();

      'データが存在しません。'
    );

}
      }

  // =========================================================
  // セーブ
  // =========================================================

  function saveGame(slotIndex) {

    const now =
      new Date();


    const timeStr =

      `${now.getFullYear()}/` +

      `${now.getMonth() + 1}/` +

      `${now.getDate()} ` +

      `${now.getHours()}:` +

      `${String(
        now.getMinutes()
      ).padStart(
        2,
        '0'
      )}`;


    const currentEntryId =
      getCurrentEntryId();


    const saveData = {


      // セーブデータ形式
      version: 8,


      scene:
        currentScene,


      step:
        currentStep,


      // 将来的なシナリオ変更に備えIDも保存
      entryId:
        currentEntryId,


      playerLastName:
        playerLastName,


      playerFirstName:
        playerFirstName,


  chapterName:
  getCurrentChapterName(),


      currentBackground:
      currentBackground,

sceneBgm:
  sceneBgm,

      timestamp:
        timeStr,


      dialogueHistory:
        dialogueHistory,


// -------------------------------------------------------
// 現在の調査画面の状態
// -------------------------------------------------------

isInvestigationMode: isInvestigationMode,

currentInvestigationId: currentInvestigationId,


// -------------------------------------------------------
// 調査状態
// -------------------------------------------------------

investigationFlags:
{
  ...investigationFlags
},


// -------------------------------------------------------
// タブレットアプリ解放状態
// -------------------------------------------------------

tabletAppUnlocked:
{
  ...tabletAppUnlocked
},


// -------------------------------------------------------
// 人物情報の個別解放状態
// -------------------------------------------------------

characterUnlocked: {
  ...characterUnlocked
},


// -------------------------------------------------------
// 持ち物
// -------------------------------------------------------

inventory: {
  ...inventory
},


// -------------------------------------------------------
// キャラクターパラメータ
// -------------------------------------------------------

characterParams:
{
  kyoya: {
    ...characterParams.kyoya
  },

  kezi: {
    ...characterParams.kezi
  },

  aoi: {
    ...characterParams.aoi
  },

  shion: {
    ...characterParams.shion
  },

  anna: {
    ...characterParams.anna
  },

  rento: {
    ...characterParams.rento
  }
}

};

    try {


      localStorage.setItem(
        `floriography_save_${slotIndex}`,
        JSON.stringify(
          saveData
        )
      );


      showMessage(
        `スロット ${slotIndex} にセーブしました。`
      );


    } catch (e) {


      console.error(
        "セーブに失敗しました。",
        e
      );


      showMessage(
        "セーブに失敗しました。"
      );
    }
  }


  // =========================================================
  // ロード
  // =========================================================

async function loadGame(slotIndex) {

    const rawData =
      localStorage.getItem(
        `floriography_save_${slotIndex}`
      );


    if (!rawData) {
      return;
    }


    let saveData;


    try {


      saveData =
        JSON.parse(
          rawData
        );


    } catch (e) {


      console.error(
        "セーブデータの読み込みに失敗しました。",
        e
      );


      showMessage(
        "セーブデータを読み込めませんでした。"
      );


      return;
    }


    stopSkipMode();
    stopTextTimer();
    stopAutoMode();


    // -------------------------------------------------------
    // シーン復元
    // -------------------------------------------------------

if (saveData.scene) {

  currentScene =
    saveData.scene;

} else {

  // 古いセーブデータとの互換用
  currentScene =
    getSceneIdFromChapterName(
      saveData.chapterName
    );
}


    // -------------------------------------------------------
    // 名前復元
    // -------------------------------------------------------

    playerLastName =
      saveData.playerLastName
      ?? "七條";


    playerFirstName =
      saveData.playerFirstName
      ?? "七星";


// -------------------------------------------------------
// 調査・タブレット状態を一度初期化
// -------------------------------------------------------

resetInvestigationAndTabletState();


resetInventory();


// -------------------------------------------------------
// キャラクターパラメータも一度初期化
// -------------------------------------------------------

resetCharacterParams();


resetCharacterUnlocked();


// -------------------------------------------------------
// 調査状態を復元
// -------------------------------------------------------

if (
  saveData.investigationFlags &&
  typeof saveData.investigationFlags ===
    "object"
) {

  Object.assign(
    investigationFlags,
    saveData.investigationFlags
  );
}


// -------------------------------------------------------
// 持ち物を復元
// -------------------------------------------------------

if (
  saveData.inventory &&
  typeof saveData.inventory ===
    "object"
) {

  Object.assign(
    inventory,
    saveData.inventory
  );

} else {

  // -----------------------------------------------------
  // 旧セーブデータ互換
  // -----------------------------------------------------

  if (
    investigationFlags
      .studentBookFound
  ) {

    inventory.studentBook =
      true;
  }
}


// -------------------------------------------------------
// タブレットアプリ解放状態を復元
// -------------------------------------------------------

if (
  saveData.tabletAppUnlocked &&
  typeof saveData.tabletAppUnlocked ===
    "object"
) {

  Object.assign(
    tabletAppUnlocked,
    saveData.tabletAppUnlocked
  );
}


// -------------------------------------------------------
// 人物情報の個別解放状態を復元
// -------------------------------------------------------

if (
  saveData.characterUnlocked &&
  typeof saveData.characterUnlocked === "object"
) {

  Object.keys(DEFAULT_CHARACTER_UNLOCKED)
    .forEach(characterId => {

characterUnlocked[characterId] =
  typeof saveData.characterUnlocked[characterId] === "boolean"
    ? saveData.characterUnlocked[characterId]
    : DEFAULT_CHARACTER_UNLOCKED[characterId];

    });
}


// -------------------------------------------------------
// キャラクターパラメータを復元
// -------------------------------------------------------

if (
  saveData.characterParams &&
  typeof saveData.characterParams ===
    "object"
) {

  Object.keys(
    DEFAULT_CHARACTER_PARAMS
  ).forEach(
    characterId => {

      const savedCharacter =
        saveData.characterParams[
          characterId
        ];


      if (
        savedCharacter &&
        typeof savedCharacter ===
          "object"
      ) {

        Object.assign(
          characterParams[
            characterId
          ],
          savedCharacter
        );
      }

    }
  );
}


    // -------------------------------------------------------
    // バックログ復元
    // -------------------------------------------------------

    dialogueHistory =
      Array.isArray(
        saveData.dialogueHistory
      )

        ? saveData.dialogueHistory

        : [];


    const currentScenario =
      getCurrentScenario();


    // -------------------------------------------------------
    // 新方式：entryIdから位置を探す
    // -------------------------------------------------------

    if (saveData.entryId) {


      const foundIndex =
        currentScenario.findIndex(
          item =>
            item.id ===
            saveData.entryId
        );


      if (foundIndex !== -1) {


        currentStep =
          foundIndex;


      } else {


        currentStep =
          Number.isInteger(
            saveData.step
          )

            ? saveData.step

            : 0;
      }


    } else {


      // 旧セーブデータ
      currentStep =
        Number.isInteger(
          saveData.step
        )

          ? saveData.step

          : 0;
    }


    // -------------------------------------------------------
    // 範囲外防止
    // -------------------------------------------------------

    if (currentStep < 0) {

      currentStep = 0;
    }


    if (
      currentStep >=
      currentScenario.length
    ) {

      currentStep =
        currentScenario.length - 1;
    }


// -------------------------------------------------------
// 背景復元
// -------------------------------------------------------

changeBackground(
  saveData.currentBackground ?? null
);


// -------------------------------------------------------
// シーンBGM復元
// -------------------------------------------------------

if (
  Object.prototype.hasOwnProperty.call(
    saveData,
    "sceneBgm"
  )
) {

  // version 6以降
  sceneBgm =
    saveData.sceneBgm
    ?? null;

} else {

  // -----------------------------------------------------
  // 旧セーブデータ
  //
  // 旧currentBgmにはタブレットBGMなどが
  // 入っている可能性があるため、
  // シナリオから本来のBGMを再計算する
  // -----------------------------------------------------

  sceneBgm =
    getSceneBgmFromScenario(
      currentScenario,
      currentStep
    );
}


// -------------------------------------------------------
// BGM再生
// -------------------------------------------------------

if (
  sceneBgm
) {

  await playBgm(
    sceneBgm
  );

} else {

  stopBgm();
}



// -------------------------------------------------------
// 現在の画面を復元
// -------------------------------------------------------

const currentData = currentScenario[currentStep];

if (
  currentData &&
  currentData.type === "investigation"
) {

  // 調査シーンを復元
  renderInvestigationScreen(
    currentData.investigationId
  );

} else {

  // 通常の会話画面を復元
  renderDialogueScreen();

  updateDialogue();

}


// -------------------------------------------------------
// フェード解除
// -------------------------------------------------------

gameContainer.classList.remove(
  'fade-out'
);

}

      return;
    }

    // 会話枠が非表示なら反応させない
    if (
      dialogueBox.classList.contains('hidden')
    ) {
      return;
    }

    // AUTO中なら解除
    if (isAutoMode) {
      stopAutoMode();
    }

    // SKIP中なら解除
    if (isSkipMode) {
      stopSkipMode();
    }

    nextDialogue();
  }
);


  }


  // =========================================================
  // 起動
  // =========================================================

  window.addEventListener(
  'DOMContentLoaded',
  () => {

    resizeGameScreen();

checkScenarioIds();

    initUIEvents();


    // 保存された速度をスライダーにも反映
    const speedSlider =
      document.getElementById(
        'text-speed-slider'
      );

    if (speedSlider) {
      speedSlider.value =
        String(textSpeed);
    }


    updateSpeedDisplay(
      textSpeed
    );


// -------------------------------------------------------
// BGM音量設定を画面へ反映
// -------------------------------------------------------

const bgmVolumeSlider =
  document.getElementById(
    'bgm-volume-slider'
  );


const bgmVolumePercent =
  Math.round(
    bgmVolume * 100
  );


if (bgmVolumeSlider) {

  bgmVolumeSlider.value =
    String(
      bgmVolumePercent
    );
}


updateBgmVolumeDisplay(
  bgmVolumePercent
);


    showTitleScreen();


    // 初期画面の生成が終わってから表示
    requestAnimationFrame(
      () => {

        gameStage.style.opacity =
          '1';

      }
    );

  }
);


   window.addEventListener(
  'resize',
  resizeGameScreen
);

</script>


 </body>
</html>
