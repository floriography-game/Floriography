    'click',
    closeMessage
  );


    // -------------------------------------------------------
    // テキスト速度
    // -------------------------------------------------------

    const speedSlider =
      document.getElementById(
        'text-speed-slider'
      );


   speedSlider.addEventListener(
  'input',
  (e) => {

    textSpeed =
      parseInt(
        e.target.value,
        10
      );

    updateSpeedDisplay(
      textSpeed
    );


    // 設定を保存
    try {

      localStorage.setItem(
        'floriography_text_speed',
        String(textSpeed)
      );

    } catch (err) {

      console.error(
        "テキスト速度設定の保存に失敗しました。",
        err
      );
    }
  }
);


// -------------------------------------------------------
// BGM音量
// -------------------------------------------------------

const bgmVolumeSlider =
  document.getElementById(
    'bgm-volume-slider'
  );


if (bgmVolumeSlider) {

  bgmVolumeSlider.addEventListener(
    'input',
    (e) => {

      const sliderValue =
        parseInt(
          e.target.value,
          10
        );


      // 0～100 → 0.0～1.0
      bgmVolume =
        sliderValue / 100;


      // 現在再生中のBGMにも即反映
      if (bgmGainNode) {

        bgmGainNode.gain.value =
          bgmVolume;
      }


      updateBgmVolumeDisplay(
        sliderValue
      );


      // 設定を保存
      try {

        localStorage.setItem(
          'floriography_bgm_volume',
          String(bgmVolume)
        );

      } catch (err) {

        console.error(
          "BGM音量設定の保存に失敗しました。",
          err
        );
      }

    }
  );
}

    // -------------------------------------------------------
    // 会話枠を再表示
    // -------------------------------------------------------

    document.body.addEventListener(
      'click',
      (e) => {


        const dialogueBox =
          document.getElementById(
            'dialogue-box'
          );


        if (
          dialogueBox &&
          dialogueBox
            .classList
            .contains(
              'hidden'
            )
        ) {


          dialogueBox
            .classList
            .remove(
              'hidden'
            );


          menuContainer
            .classList
            .remove(
              'hidden'
            );


          e.stopPropagation();
        }

      },
      true
    );

// -------------------------------------------------------
// Enterキーで会話を進める
// -------------------------------------------------------

document.addEventListener(
  'keydown',
  (e) => {

    // Enterキー以外は無視
    if (e.key !== 'Enter') {
      return;
    }

    // スポットライト演出中はEnterキーで進めない
    if (isTabletSpotlightActive) {
      e.preventDefault();
      return;
    }



// -------------------------------------------------------
// 持ち物ウィンドウ表示中
// -------------------------------------------------------

const inventoryOverlay =
  document.getElementById("inventory-overlay");

if (
  inventoryOverlay &&
  inventoryOverlay.classList.contains("active")
) {
  return;
}


// -------------------------------------------------------
// 通常会話からタブレットを開いている間
// -------------------------------------------------------

if (
  document.querySelector(".dialogue-tablet-screen")
) {
  return;
}


    // 名前入力欄など、入力中なら反応させない
    const activeElement = document.activeElement;

    if (
      activeElement &&
      (
        activeElement.tagName === 'INPUT' ||
        activeElement.tagName === 'TEXTAREA'
      )
    ) {
      return;
    }

    // MENUが開いている場合は反応させない
    const sidebar =
      document.getElementById('sidebar');

    if (
      sidebar &&
      sidebar.classList.contains('open')
    ) {
      return;
    }

    // セーブ/ロード画面が開いている場合は反応させない
    const slotModal =
      document.getElementById('slot-modal-overlay');

    if (
      slotModal &&
      slotModal.classList.contains('active')
    ) {
      return;
    }

    // バックログが開いている場合は反応させない
    const logModal =
      document.getElementById('log-modal-overlay');

    if (
      logModal &&
      logModal.classList.contains('active')
    ) {
      return;
    }

    // CONFIGが開いている場合は反応させない
    const configModal =
      document.getElementById('config-modal-overlay');

    if (
      configModal &&
      configModal.classList.contains('active')
    ) {
      return;
    }

// メッセージウィンドウが開いている場合
const messageOverlay =
  document.getElementById(
    'message-overlay'
  );

if (
  messageOverlay &&
  messageOverlay.classList.contains(
    'active'
  )
) {
  return;
}


// -------------------------------------------------------
// 調査中テキストボックス
// -------------------------------------------------------

const investigationResultBox =
  document.querySelector(
    '.investigation-result-box'
  );


if (investigationResultBox) {

  investigationResultBox.click();

  return;
}


    // 会話画面が存在しない場合は反応させない
    const dialogueBox =
      document.getElementById('dialogue-box');

    if (!dialogueBox) {
      return;
    }

    // 会話枠が非表示なら反応させない
    if (
      dialogueBox.classList.contains('hidden')
    ) {
      return;
    }

    // AUTO中なら解除
    if (isAutoMode) {
      stopAutoMode();
    }

    // SKIP中なら解除
    if (isSkipMode) {
      stopSkipMode();
    }

    nextDialogue();
  }
);


  }


  // =========================================================
  // 起動
  // =========================================================

  window.addEventListener(
  'DOMContentLoaded',
  () => {

    resizeGameScreen();

　　checkScenarioIds();

　　checkGameData();

    initUIEvents();


    // 保存された速度をスライダーにも反映
    const speedSlider =
      document.getElementById(
        'text-speed-slider'
      );

    if (speedSlider) {
      speedSlider.value =
        String(textSpeed);
    }


    updateSpeedDisplay(
      textSpeed
    );


// -------------------------------------------------------
// BGM音量設定を画面へ反映
// -------------------------------------------------------

const bgmVolumeSlider =
  document.getElementById(
    'bgm-volume-slider'
  );


const bgmVolumePercent =
  Math.round(
    bgmVolume * 100
  );


if (bgmVolumeSlider) {

  bgmVolumeSlider.value =
    String(
      bgmVolumePercent
    );
}


updateBgmVolumeDisplay(
  bgmVolumePercent
);


    showTitleScreen();


    // 初期画面の生成が終わってから表示
    requestAnimationFrame(
      () => {

        gameStage.style.opacity =
          '1';

      }
    );

  }
);


   window.addEventListener(
  'resize',
  resizeGameScreen
);

</script>


 </body>
</html>
