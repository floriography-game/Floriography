const GAME_HEIGHT = 720;

  const viewportWidth =
    window.innerWidth;

  const viewportHeight =
    window.innerHeight;


  const scaleX =
    viewportWidth / GAME_WIDTH;

  const scaleY =
    viewportHeight / GAME_HEIGHT;


  // 縦横とも画面内に収まる最大倍率
  const scale =
    Math.min(
      scaleX,
      scaleY
    );


  gameStage.style.transform =
    `translate(-50%, -50%) scale(${scale})`;
}

      readFlags = [];
    }

// =========================================================
// 背景変更
// =========================================================

function changeBackground(imageName) {

  // 現在の背景を記憶
  currentBackground = imageName;


  if (!imageName) {

    gameContainer.style.backgroundImage =
      'none';

    return;
  }


  gameContainer.style.backgroundImage =
    `url("backgrounds/${imageName}")`;
}

  // =========================================================
  // 現在のシナリオ取得
  // =========================================================

  function getCurrentScenario() {

    if (currentScene === "chapter1") {
      return chapter1Scenario;
    }

    return scenario;
  }


  // =========================================================
  // 現在のシナリオID取得
  // =========================================================

  function getCurrentEntryId() {

    const currentScenario =
      getCurrentScenario();

    const data =
      currentScenario[currentStep];


    if (!data) {
      return null;
    }


    // 新方式
    if (data.id) {
      return data.id;
    }


    // 万一旧形式のデータが残っていた場合
    return `${currentScene}_${currentStep}`;
  }


  // =========================================================
  // 既読判定
  // =========================================================

  function isCurrentStepRead() {

    const id =
      getCurrentEntryId();


    if (!id) {
      return false;
    }


    return readFlags.includes(id);
  }


  // =========================================================
  // 既読登録
  // =========================================================

  function markCurrentStepAsRead() {

    const id =
      getCurrentEntryId();


    if (!id) {
      return;
    }


    if (!readFlags.includes(id)) {

      readFlags.push(id);


      try {

        localStorage.setItem(
          'floriography_read_flags',
          JSON.stringify(readFlags)
        );

      } catch (e) {

        console.error(
          "既読データの保存に失敗しました。",
          e
        );
      }
    }
  }


  // =========================================================
  // タイマー停止
  // =========================================================

  function stopTextTimer() {

    if (timerId) {

      clearInterval(timerId);

      timerId = null;
    }


    isTyping = false;
  }

// =========================================================
// AUTO停止
// =========================================================

function stopAutoMode() {

  isAutoMode = false;

  if (autoTimerId) {

    clearTimeout(autoTimerId);

    autoTimerId = null;
  }


  const autoBtn =
    document.getElementById(
      'auto-btn'
    );


  if (autoBtn) {

    autoBtn.classList.remove(
      'active-auto'
    );
  }
}


// =========================================================
// AUTO待機時間を文章の長さから計算
// =========================================================

function getAutoWaitTime(text) {

  const length = text.length;

  const calculated =
    autoBaseWait +
    length * autoPerCharWait;

  return Math.min(
    calculated,
    autoMaxWait
  );
}

  // =========================================================
  // SKIP停止
  // =========================================================

  function stopSkipMode() {

    isSkipMode = false;


    if (skipTimerId) {

      clearTimeout(skipTimerId);

      skipTimerId = null;
    }


    const skipBtn =
      document.getElementById(
        'skip-btn'
      );


    if (skipBtn) {

      skipBtn.classList.remove(
        'active-skip'
      );
    }
  }


  // =========================================================
  // 会話画面生成
  // =========================================================

function renderDialogueScreen() {

  // プロローグを含め、会話画面では常にMENUを表示
  menuContainer.classList.add('active');
  menuContainer.classList.remove('hidden');


  gameContainer.innerHTML = `

    <div
      class="game-screen"
      id="game-screen"
    >

      <div
        class="dialogue-box"
        id="dialogue-box"
      >

        <button
          type="button"
          class="close-btn"
          id="close-btn"
        >
          ×
        </button>


        <button
          type="button"
          class="auto-btn"
          id="auto-btn"
        >
          AUTO
        </button>


        <button
          type="button"
          class="skip-btn"
          id="skip-btn"
        >
          SKIP
        </button>


        <div
          class="character-name"
          id="char-name"
        ></div>


        <div
          id="dialogue-text"
        ></div>


        <div
          class="next-mark"
          id="next-btn"
        >
          ▽
        </div>

      </div>

    </div>
  `;


  // =========================================================
  // 会話ボックス全体クリックで次へ
  // =========================================================

  const dialogueBox =
    document.getElementById('dialogue-box');


  dialogueBox.addEventListener(
    'click',
    (e) => {

      // SKIP・AUTO・×を押した場合は会話送りしない
      if (
        e.target.closest('#skip-btn') ||
        e.target.closest('#auto-btn') ||
        e.target.closest('#close-btn')
      ) {
        return;
      }


      // SKIP中なら解除
      if (isSkipMode) {
        stopSkipMode();
      }


      // AUTO中なら解除
      if (isAutoMode) {
        stopAutoMode();
      }


      nextDialogue();
    }
  );


  // =========================================================
  // SKIPボタン
  // =========================================================

  document
    .getElementById('skip-btn')
    .addEventListener(
      'click',
      (e) => {

        e.stopPropagation();


        if (!isSkipMode) {

          // 現在の行が未読ならSKIP不可
          if (!isCurrentStepRead()) {

            alert(
              "ここから先は未読のため、スキップできません。"
            );

            return;
          }


          // AUTO中なら解除
          if (isAutoMode) {
            stopAutoMode();
          }


          isSkipMode = true;


          const skipBtn =
            document.getElementById('skip-btn');


          if (skipBtn) {
            skipBtn.classList.add('active-skip');
          }


          nextDialogue();


        } else {

          stopSkipMode();
        }
      }
    );


  // =========================================================
  // AUTOボタン
  // =========================================================

  document
    .getElementById('auto-btn')
    .addEventListener(
      'click',
      (e) => {

        e.stopPropagation();


        // AUTO開始
        if (!isAutoMode) {

          // SKIP中なら解除
          if (isSkipMode) {
            stopSkipMode();
          }


          isAutoMode = true;


          const autoBtn =
            document.getElementById('auto-btn');


          if (autoBtn) {
            autoBtn.classList.add('active-auto');
          }


          // すでに文章全文が表示済みなら、
          // 少し待って次へ進む

    if (!isTyping) {

  const waitTime =
    getAutoWaitTime(currentText);

  autoTimerId =
    setTimeout(
      () => {

        nextDialogue();

      },
      waitTime
    );
}

        } else {

          // 再度押したらAUTO停止
          stopAutoMode();
        }
      }
    );


  bindCloseButton();
}



  // =========================================================
  // シナリオ内容を判定して表示
  // =========================================================

  function updateDialogue() {

    const currentScenario =
      getCurrentScenario();


    const data =
      currentScenario[currentStep];


    if (!data) {
      return;
    }


    // -------------------------------------------------------
    // 通常会話
    // -------------------------------------------------------

    if (data.type === "dialogue") {

      showDialogueEntry(data);

      return;
    }

if (data.type === "background") {

  changeBackground(
    data.image
  );

  currentStep++;

  updateDialogue();

  return;
}


    // 将来的に
    //
    // type: "choice"
    // type: "background"
    // type: "music"
    //
    // などをここへ追加可能

    console.warn(
      "未対応のシナリオタイプです:",
      data.type
    );
  }


  // =========================================================
  // 通常会話表示
  // =========================================================

  function showDialogueEntry(data) {

    const charName =
      document.getElementById(
        'char-name'
      );


    const dialogueText =
      document.getElementById(
        'dialogue-text'
      );


    if (!charName || !dialogueText) {
      return;
    }


    charName.textContent =
      replaceNameTags(
        data.name
      );


    // -------------------------------------------------------
    // バックログ追加
    // -------------------------------------------------------

    addDialogueToHistory(
      data.name,
      data.text
    );


    // -------------------------------------------------------
    // SKIP中
    // -------------------------------------------------------

    if (isSkipMode) {

      stopTextTimer();


      dialogueText.textContent =
        replaceNameTags(
          data.text
        );


      skipTimerId =
        setTimeout(
          () => {

            nextDialogue();

          },
          30
        );


      return;
    }


    // -------------------------------------------------------
    // 通常表示
    // -------------------------------------------------------

    typeWriter(
      replaceNameTags(
        data.text
      )
    );
  }


  // =========================================================
  // 次の文章へ
  // =========================================================

 function nextDialogue() {

  const currentScenario =
    getCurrentScenario();


  // =========================================================
  // タイプライター途中なら全文表示
  // =========================================================

  if (
    isTyping &&
    !isSkipMode &&
    !isAutoMode
  ) {

    stopTextTimer();


    const dialogueText =
      document.getElementById(
        'dialogue-text'
      );


    if (dialogueText) {

      dialogueText.textContent =
        currentText;
    }


    return;
  }


  // =========================================================
  // 今読んだ文章を既読にする
  // =========================================================

  markCurrentStepAsRead();


  // =========================================================
  // 次へ
  // =========================================================

  currentStep++;


  // =========================================================
  // シーン終了
  // =========================================================

  if (
    currentStep >=
    currentScenario.length
  ) {

    stopSkipMode();
    stopAutoMode();


    if (
      currentScene === "prologue"
    ) {

      showNameScene();

    } else {

      alert(
        "現在のシナリオはここまでです！"
      );
    }


    return;
  }


  // =========================================================
  // 未読に到達したらSKIP終了
  // =========================================================

  if (
    isSkipMode &&
    !isCurrentStepRead()
  ) {

    stopSkipMode();
  }


  updateDialogue();
}

  // =========================================================
  // タイプライター
  // =========================================================

  function typeWriter(text) {

  const textElement =
    document.getElementById(
      'dialogue-text'
    );


  if (!textElement) {
    return;
  }


  stopTextTimer();


  textElement.textContent = "";


  let index = 0;


  isTyping = true;
  currentText = text;


  timerId =
    setInterval(
      () => {


        // 画面がすでに切り替わっていたら終了
        if (
          !document.body.contains(
            textElement
          )
        ) {

          stopTextTimer();

          return;
        }


        textElement.textContent +=
          text[index];


        index++;


        // =====================================================
        // 全文表示完了
        // =====================================================

        if (
          index >=
          text.length
        ) {

          stopTextTimer();


          // AUTO中なら少し待って次へ

     if (isAutoMode) {

  const waitTime =
    getAutoWaitTime(text);

  autoTimerId =
    setTimeout(
      () => {

        nextDialogue();

      },
      waitTime
    );
}
        }

      },
      textSpeed
    );
}

  // =========================================================
  // ゲーム開始
  // =========================================================

  function startGame() {

    stopSkipMode();
    stopTextTimer();
    stopAutoMode();

    changeBackground(null);

    currentScene = "prologue";
    currentStep = 0;


    dialogueHistory = [];


    menuContainer.classList.remove(
      'active'
    );


    gameContainer.classList.add(
      'fade-out'
    );


    setTimeout(
      () => {

        renderDialogueScreen();

        updateDialogue();


        gameContainer.classList.remove(
          'fade-out'
        );

      },
      900      

    );
  }


  // =========================================================
  // 名前入力
  // =========================================================

  function showNameScene() {

    stopSkipMode();
    stopTextTimer();
    stopAutoMode();


    menuContainer.classList.remove(
      'active'
    );


    gameContainer.classList.add(
      'fade-out'
    );


    setTimeout(
      () => {


        gameContainer.innerHTML = `

          <div class="input-screen">

            <div class="input-prompt">
              名前を入力してください
            </div>


            <div
              style="
                display: flex;
                gap: 10px;
              "
            >

              <input
                type="text"
                id="player-last-input"
                class="name-input"
                value="${playerLastName}"
                placeholder="姓"
                style="width: 110px;"
              >


              <input
                type="text"
                id="player-first-input"
                class="name-input"
                value="${playerFirstName}"
                placeholder="名"
                style="width: 110px;"
              >

            </div>


            <button
              id="confirm-name-btn"
              class="btn"
            >
              決定
            </button>

          </div>
        `;


        // ---------------------------------------------------
        // 「決定」
        // ---------------------------------------------------

        document
          .getElementById(
            'confirm-name-btn'
          )
          .addEventListener(
            'click',
            () => {


              const lastVal =
                document
                  .getElementById(
                    'player-last-input'
                  )
                  .value
                  .trim();


              const firstVal =
                document
                  .getElementById(
                    'player-first-input'
                  )
                  .value
                  .trim();


              // 空欄なら初期名
              const newLastName =
                lastVal !== ""
                  ? lastVal
                  : "七條";


              const newFirstName =
                firstVal !== ""
                  ? firstVal
                  : "七星";


              // ---------------------------------------------
              // 確認画面
              // ---------------------------------------------

              const overlay =
                document.createElement(
                  'div'
                );


              overlay.className =
                'name-confirm-overlay';


              overlay.innerHTML = `

                <div
                  class="name-confirm-box"
                >

                  <div
                    class="name-confirm-text"
                  >

                    名前は

                    <div
                      class="name-confirm-player-name"
                    >
                      ${newLastName}${newFirstName}
                    </div>

                    でよろしいですか？

                  </div>


                  <div
                    class="name-confirm-buttons"
                  >

                    <button
                      type="button"
                      id="name-confirm-yes"
                      class="name-confirm-btn"
                    >
                      はい
                    </button>


                    <button
                      type="button"
                      id="name-confirm-no"
                      class="name-confirm-btn"
                    >
                      いいえ
                    </button>

                  </div>

                </div>
              `;


              gameContainer.appendChild(
                overlay
              );

              requestAnimationFrame(() => {
  overlay.classList.add('show');
});


              // ---------------------------------------------
              // はい
              // ---------------------------------------------

              document
                .getElementById(
                  'name-confirm-yes'
                )
                .addEventListener(
                  'click',
                  () => {


                    playerLastName =
                      newLastName;


                    playerFirstName =
                      newFirstName;


                    startChapter1();
                  }
                );


              // ---------------------------------------------
              // いいえ
              // ---------------------------------------------

              document
                .getElementById(
                  'name-confirm-no'
                )
                .addEventListener(
                  'click',
                  () => {


                    overlay.remove();


                    document
                      .getElementById(
                        'player-last-input'
                      )
                      .focus();
                  }
                );

            }
          );


        gameContainer.classList.remove(
          'fade-out'
        );

      },
      600
    );
  }

    );
  }


  // =========================================================
  // 名前タグ置換
  // =========================================================

  function replaceNameTags(text) {

    if (!text) {
      return "";
    }


    const fullName =
      playerLastName +
      playerFirstName;


    return text

      .replace(
        /[{｛](LAST_NAME|姓)[}｝]/g,
        playerLastName
      )

      .replace(
        /[{｛](FIRST_NAME|名)[}｝]/g,
        playerFirstName
      )

      .replace(
        /[{｛](NAME|フルネーム)[}｝]/g,
        fullName
      );
  }


  // =========================================================
  // バックログ追加
  // =========================================================

  function addDialogueToHistory(
    rawName,
    rawText
  ) {

    const name =
      replaceNameTags(
        rawName
      ).trim();


    const text =
      replaceNameTags(
        rawText
      );


    const last =
      dialogueHistory[
        dialogueHistory.length - 1
      ];


    // 同じ文章の二重登録防止
    if (
      last &&
      last.name === name &&
      last.text === text
    ) {

      return;
    }


    dialogueHistory.push({
      name,
      text
    });
  }


  // =========================================================
  // バックログ
  // =========================================================

  function openLogModal() {

    const overlay =
      document.getElementById(
        'log-modal-overlay'
      );


    const container =
      document.getElementById(
        'log-container'
      );


    container.innerHTML = '';


    if (
      dialogueHistory.length === 0
    ) {

      container.innerHTML =
        '<div style="color: #888; text-align: center; padding-top: 20px;">まだ履歴がありません。</div>';


    } else {


      dialogueHistory.forEach(
        item => {


          const entry =
            document.createElement(
              'div'
            );


          entry.className =
            'log-entry';


          if (item.name) {


            const speaker =
              document.createElement(
                'div'
              );


            speaker.className =
              'log-speaker';


            speaker.textContent =
              item.name;


            entry.appendChild(
              speaker
            );
          }


          const text =
            document.createElement(
              'div'
            );


          text.className =
            'log-text';


          text.textContent =
            item.text;


          entry.appendChild(
            text
          );


          container.appendChild(
            entry
          );
        }
      );
    }


    overlay.classList.add(
      'active'
    );


    container.scrollTop =
      container.scrollHeight;
  }


  function closeLogModal() {

    document
      .getElementById(
        'log-modal-overlay'
      )
      .classList
      .remove('active');
  }


  // =========================================================
  // CONFIG
  // =========================================================

  function openConfigModal() {

    document
      .getElementById(
        'config-modal-overlay'
      )
      .classList
      .add('active');
  }


  function closeConfigModal() {

    document
      .getElementById(
        'config-modal-overlay'
      )
      .classList
      .remove('active');
  }


  function updateSpeedDisplay(val) {

    const display =
      document.getElementById(
        'speed-value-display'
      );


    if (val <= 20) {

      display.textContent =
        "高速";

    } else if (val <= 50) {

      display.textContent =
        "普通";

    } else {

      display.textContent =
        "低速";
    }
  }


  // =========================================================
  // セーブデータ存在確認
  // =========================================================

 function hasAnySaveData() {

  const totalSlots =
    SAVE_PAGE_COUNT * SLOTS_PER_PAGE;

  for (
    let i = 1;
    i <= totalSlots;
    i++
  ) {

    if (
      localStorage.getItem(
        `floriography_save_${i}`
      ) !== null
    ) {
      return true;
    }
  }

  return false;
}

  // =========================================================
  // 全画面
  // =========================================================

  function toggleFullscreen() {

    if (!document.fullscreenElement) {


      document
        .documentElement
        .requestFullscreen()
        .catch(
          err => {

            alert(
              `全画面表示エラー: ${err.message}`
            );
          }
        );


    } else {


      if (document.exitFullscreen) {

        document.exitFullscreen();
      }
    }
  }


  // =========================================================
  // タイトル画面
  // =========================================================

  function showTitleScreen() {

    stopSkipMode();
    stopTextTimer();
    stopAutoMode();

    changeBackground(null);

    currentScene =
      "prologue";


    currentStep =
      0;


    dialogueHistory =
      [];


    menuContainer.classList.remove(
      'active'
    );


    menuContainer.classList.remove(
      'hidden'
    );


    gameContainer.innerHTML = `

      <h1 id="title-text">
        Floriography
      </h1>


      <div class="button-group">


        <button
          id="start-btn"
          class="btn"
        >
          はじめから
        </button>


        ${
          hasAnySaveData()

            ? `
              <button
                id="title-load-btn"
                class="btn"
              >
                つづきから
              </button>
            `

            : ''
        }


        <button
          id="fullscreen-btn"
          class="btn"
        >
          全画面モードで遊ぶ
        </button>


      </div>
    `;


    document
      .getElementById(
        'start-btn'
      )
      .addEventListener(
        'click',
        startGame
      );


    document
      .getElementById(
        'fullscreen-btn'
      )
      .addEventListener(
        'click',
        toggleFullscreen
      );


    if (hasAnySaveData()) {

      document
        .getElementById(
          'title-load-btn'
        )
        .addEventListener(
          'click',

            openSlotModal(
              'load'
            );
          }
        );

  }


  // =========================================================
  // 会話枠非表示
  // =========================================================

  function bindCloseButton() {

    const closeBtn =
      document.getElementById(
        'close-btn'
      );


    const dialogueBox =
      document.getElementById(
        'dialogue-box'
      );


    if (
      closeBtn &&
      dialogueBox
    ) {


      closeBtn.addEventListener(
        'click',
        (e) => {


          e.stopPropagation();


          dialogueBox
            .classList
            .add('hidden');


          menuContainer
            .classList
            .add('hidden');

        }
      );

  // =========================================================
  // セーブ／ロード画面
  // =========================================================

 function openSlotModal(mode) {

  const modalOverlay =
    document.getElementById(
      'slot-modal-overlay'
    );

  const modalHeader =
    document.getElementById(
      'slot-modal-header'
    );

  const slotList =
    document.getElementById(
      'slot-list'
    );


  modalHeader.textContent =
    mode === 'save'
      ? 'セーブするSLOTを選択'
      : 'ロードするSLOTを選択';


  slotList.innerHTML = '';


  // =====================================================
  // 第一段階：SLOTページを表示
  // =====================================================

  for (
    let page = 1;
    page <= SAVE_PAGE_COUNT;
    page++
  ) {

    const pageItem =
      document.createElement('div');

    pageItem.className =
      'slot-item';


    // このページにセーブデータがあるか確認
    let savedCount = 0;

    for (
      let sub = 1;
      sub <= SLOTS_PER_PAGE;
      sub++
    ) {

      const actualSlot =
        (page - 1) *
        SLOTS_PER_PAGE +
        sub;

      if (
        localStorage.getItem(
          `floriography_save_${actualSlot}`
        ) !== null
      ) {
        savedCount++;
      }
    }


    pageItem.innerHTML = `
      <div class="slot-info">

        <div class="slot-number">
          SLOT ${page}
        </div>

        <div class="slot-detail">
          ${savedCount} / ${SLOTS_PER_PAGE} 保存済み
        </div>

      </div>
    `;


    pageItem.addEventListener(
      'click',
      () => {

        openSavePage(
          mode,
          page
        );
      }
    );


    slotList.appendChild(
      pageItem
    );
  }


  modalOverlay
    .classList
    .add('active');
}

function openSavePage(
  mode,
  page
) {

  const modalHeader =
    document.getElementById(
      'slot-modal-header'
    );

  const slotList =
    document.getElementById(
      'slot-list'
    );


  modalHeader.textContent =
    mode === 'save'
      ? `SLOT ${page}：セーブ先を選択`
      : `SLOT ${page}：ロードするデータを選択`;


  slotList.innerHTML = '';


  // =====================================================
  // 第二段階：ページ内のセーブ枠
  // =====================================================

  for (
    let subSlot = 1;
    subSlot <= SLOTS_PER_PAGE;
    subSlot++
  ) {

    const actualSlot =
      (page - 1) *
      SLOTS_PER_PAGE +
      subSlot;


    const rawData =
      localStorage.getItem(
        `floriography_save_${actualSlot}`
      );


    let saveData = null;


    if (rawData) {

      try {

        saveData =
          JSON.parse(rawData);

      } catch (e) {

        console.error(
          `セーブデータ ${actualSlot} が壊れています。`,
          e
        );
      }
    }


    const slotItem =
      document.createElement(
        'div'
      );

    slotItem.className =
      'slot-item';


    if (saveData) {

      const saveLastName =
        saveData.playerLastName
        ?? "七條";


      const saveFirstName =
        saveData.playerFirstName
        ?? "七星";


      const saveChapterName =
        saveData.chapterName

        ?? (
          saveData.scene ===
          "chapter1"

            ? "第一章"

            : "プロローグ"
        );


      slotItem.innerHTML = `

        <div class="slot-info">

          <div class="slot-number">
            SAVE ${subSlot}
          </div>

          <div class="slot-detail">
            ${saveChapterName}
            （${saveLastName}${saveFirstName}）
          </div>

        </div>

        <div class="slot-date">
          ${saveData.timestamp ?? ""}
        </div>
      `;


    } else {

      slotItem.innerHTML = `

        <div class="slot-info">

          <div class="slot-number">
            SAVE ${subSlot}
          </div>

          <div
            class="slot-detail"
            style="color: #666;"
          >
            データなし
          </div>

        </div>
      `;
    }


    slotItem.addEventListener(
      'click',
      () => {

        if (mode === 'save') {

          saveGame(
            actualSlot
          );

          closeSlotModal();


        } else {

          if (saveData) {

            loadGame(
              actualSlot
            );

            closeSlotModal();


          } else {

            alert(
              'データが存在しません。'
            );
          }
        }
      }
    );


    slotList.appendChild(
      slotItem
    );
  }


  // =====================================================
  // SLOT一覧へ戻るボタン
  // =====================================================

  const backButton =
    document.createElement(
      'button'
    );

  backButton.className =
    'sidebar-btn';

  backButton.textContent =
    '← SLOT一覧に戻る';


  backButton.addEventListener(
    'click',
    () => {

      openSlotModal(
        mode
      );
    }
  );


  slotList.appendChild(
    backButton
  );
}


// =========================================================
// セーブ／ロードモーダルを閉じる
// =========================================================

function closeSlotModal() {

  document
    .getElementById(
      'slot-modal-overlay'
    )
    .classList
    .remove('active');
}


  // =========================================================
  // セーブ
  // =========================================================

  function saveGame(slotIndex) {

    const now =
      new Date();


    const timeStr =

      `${now.getFullYear()}/` +

      `${now.getMonth() + 1}/` +

      `${now.getDate()} ` +

      `${now.getHours()}:` +

      `${String(
        now.getMinutes()
      ).padStart(
        2,
        '0'
      )}`;


    const currentEntryId =
      getCurrentEntryId();


    const saveData = {


      // セーブデータ形式
      version: 3,


      scene:
        currentScene,


      step:
        currentStep,


      // 将来的なシナリオ変更に備えIDも保存
      entryId:
        currentEntryId,


      playerLastName:
        playerLastName,


      playerFirstName:
        playerFirstName,


      chapterName:
        currentScene === "prologue"

          ? "プロローグ"

          : "第一章",

      currentBackground:
      currentBackground,

      timestamp:
        timeStr,


      dialogueHistory:
        dialogueHistory

    };


    try {


      localStorage.setItem(
        `floriography_save_${slotIndex}`,
        JSON.stringify(
          saveData
        )
      );


      alert(
        `スロット ${slotIndex} にセーブしました。`
      );


    } catch (e) {


      console.error(
        "セーブに失敗しました。",
        e
      );


      alert(
        "セーブに失敗しました。"
      );
    }
  }


  // =========================================================
  // ロード
  // =========================================================

  function loadGame(slotIndex) {

    const rawData =
      localStorage.getItem(
        `floriography_save_${slotIndex}`
      );


    if (!rawData) {
      return;
    }


    let saveData;


    try {


      saveData =
        JSON.parse(
          rawData
        );


    } catch (e) {


      console.error(
        "セーブデータの読み込みに失敗しました。",
        e
      );


      alert(
        "セーブデータを読み込めませんでした。"
      );


      return;
    }


    stopSkipMode();
    stopTextTimer();
    stopAutoMode();


    // -------------------------------------------------------
    // シーン復元
    // -------------------------------------------------------

    if (saveData.scene) {


      currentScene =
        saveData.scene;


    } else {


      currentScene =
        saveData.chapterName === "第一章"

          ? "chapter1"

          : "prologue";
    }


    // -------------------------------------------------------
    // 名前復元
    // -------------------------------------------------------

    playerLastName =
      saveData.playerLastName
      ?? "七條";


    playerFirstName =
      saveData.playerFirstName
      ?? "七星";


    // -------------------------------------------------------
    // バックログ復元
    // -------------------------------------------------------

    dialogueHistory =
      Array.isArray(
        saveData.dialogueHistory
      )

        ? saveData.dialogueHistory

        : [];


    const currentScenario =
      getCurrentScenario();


    // -------------------------------------------------------
    // 新方式：entryIdから位置を探す
    // -------------------------------------------------------

    if (saveData.entryId) {


      const foundIndex =
        currentScenario.findIndex(
          item =>
            item.id ===
            saveData.entryId
        );


      if (foundIndex !== -1) {


        currentStep =
          foundIndex;


      } else {


        currentStep =
          Number.isInteger(
            saveData.step
          )

            ? saveData.step

            : 0;
      }


    } else {


      // 旧セーブデータ
      currentStep =
        Number.isInteger(
          saveData.step
        )

          ? saveData.step

          : 0;
    }


    // -------------------------------------------------------
    // 範囲外防止
    // -------------------------------------------------------

    if (currentStep < 0) {

      currentStep = 0;
    }


    if (
      currentStep >=
      currentScenario.length
    ) {

      currentStep =
        currentScenario.length - 1;
    }


    // -------------------------------------------------------
    // 画面生成
    // -------------------------------------------------------

    changeBackground(
  saveData.currentBackground ?? null
);
   
    renderDialogueScreen();

    updateDialogue();


    gameContainer.classList.remove(
      'fade-out'
    );
  }


  // =========================================================
  // UIイベント
  // =========================================================

  function initUIEvents() {

    const menuToggleBtn =
      document.getElementById(
        'menu-toggle-btn'
      );


    const sidebarOverlay =
      document.getElementById(
        'sidebar-overlay'
      );


    const sidebar =
      document.getElementById(
        'sidebar'
      );


    const sidebarCloseBtn =
      document.getElementById(
        'sidebar-close-btn'
      );


    // -------------------------------------------------------
    // MENUを閉じる
    // -------------------------------------------------------

    const closeSidebar =
      () => {


        sidebarOverlay
          .classList
          .remove('active');


        sidebar
          .classList
          .remove('open');
      };


    // -------------------------------------------------------
    // MENU
    // -------------------------------------------------------

menuToggleBtn
  .addEventListener(
    'click',
    () => {

      // AUTO中なら解除
      if (isAutoMode) {
        stopAutoMode();
      }

      // SKIP中なら解除
      if (isSkipMode) {
        stopSkipMode();
      }

      sidebarOverlay
        .classList
        .add('active');

      sidebar
        .classList
        .add('open');
    }
  );

    sidebarCloseBtn
      .addEventListener(
        'click',
        closeSidebar
      );


    sidebarOverlay
      .addEventListener(
        'click',
        closeSidebar
      );


    // -------------------------------------------------------
    // Backlog
    // -------------------------------------------------------

document
  .getElementById(
    'sidebar-log-btn'
  )
  .addEventListener(
    'click',
    () => {

      stopAutoMode();
      stopSkipMode();

      closeSidebar();

      openLogModal();
    }
  );


    // -------------------------------------------------------
    // Save
    // -------------------------------------------------------

    document
      .getElementById(
        'sidebar-save-btn'
      )
      .addEventListener(
        'click',
        () => {

          stopAutoMode();
          stopSkipMode();
      

          closeSidebar();

          openSlotModal(
            'save'
          );
        }
      );


    // -------------------------------------------------------
    // Load
    // -------------------------------------------------------

    document
      .getElementById(
        'sidebar-load-btn'
      )
      .addEventListener(
        'click',
        () => {

          stopAutoMode();
          stopSkipMode();


          closeSidebar();

          openSlotModal(
            'load'
          );
        }
      );


    // -------------------------------------------------------
    // Config
    // -------------------------------------------------------

    document
      .getElementById(
        'sidebar-config-btn'
      )
      .addEventListener(
        'click',
        () => {

          stopAutoMode();
          stopSkipMode();


          closeSidebar();

          openConfigModal();
        }
      );


    // -------------------------------------------------------
    // Back to title
    // -------------------------------------------------------

    document
      .getElementById(
        'sidebar-title-btn'
      )
      .addEventListener(
        'click',
        () => {

          stopAutoMode();
          stopSkipMode();



          closeSidebar();


          stopSkipMode();

          stopTextTimer();


          gameContainer.classList.add(
            'fade-out'
          );


          setTimeout(
            () => {


              showTitleScreen();


              gameContainer
                .classList
                .remove(
                  'fade-out'
                );

            },
            400
          );
        }
      );


    // -------------------------------------------------------
    // モーダル閉じる
    // -------------------------------------------------------

    document
      .getElementById(
        'slot-close-btn'
      )
      .addEventListener(
        'click',
        closeSlotModal
      );


    document
      .getElementById(
        'log-close-btn'
      )
      .addEventListener(
        'click',
        closeLogModal
      );


    document
      .getElementById(
        'config-close-btn'
      )
      .addEventListener(
        'click',
        closeConfigModal
      );


    // -------------------------------------------------------
    // テキスト速度
    // -------------------------------------------------------

    const speedSlider =
      document.getElementById(
        'text-speed-slider'
      );


   speedSlider.addEventListener(
  'input',
  (e) => {

    textSpeed =
      parseInt(
        e.target.value,
        10
      );

    updateSpeedDisplay(
      textSpeed
    );


    // 設定を保存
    try {

      localStorage.setItem(
        'floriography_text_speed',
        String(textSpeed)
      );

    } catch (err) {

      console.error(
        "テキスト速度設定の保存に失敗しました。",
        err
      );
    }
  }
);

    // -------------------------------------------------------
    // 会話枠を再表示
    // -------------------------------------------------------

    document.body.addEventListener(
      'click',
      (e) => {


        const dialogueBox =
          document.getElementById(
            'dialogue-box'
          );


        if (
          dialogueBox &&
          dialogueBox
            .classList
            .contains(
              'hidden'
            )
        ) {


          dialogueBox
            .classList
            .remove(
              'hidden'
            );


          menuContainer
            .classList
            .remove(
              'hidden'
            );


          e.stopPropagation();
        }

      },
      true
    );

// -------------------------------------------------------
// Enterキーで会話を進める
// -------------------------------------------------------

document.addEventListener(
  'keydown',
  (e) => {

    // Enterキー以外は無視
    if (e.key !== 'Enter') {
      return;
    }

    // 名前入力欄など、入力中なら反応させない
    const activeElement = document.activeElement;

    if (
      activeElement &&
      (
        activeElement.tagName === 'INPUT' ||
        activeElement.tagName === 'TEXTAREA'
      )
    ) {
      return;
    }

    // MENUが開いている場合は反応させない
    const sidebar =
      document.getElementById('sidebar');

    if (
      sidebar &&
      sidebar.classList.contains('open')
    ) {
      return;
    }

    // セーブ/ロード画面が開いている場合は反応させない
    const slotModal =
      document.getElementById('slot-modal-overlay');

    if (
      slotModal &&
      slotModal.classList.contains('active')
    ) {
      return;
    }

    // バックログが開いている場合は反応させない
    const logModal =
      document.getElementById('log-modal-overlay');

    if (
      logModal &&
      logModal.classList.contains('active')
    ) {
      return;
    }

    // CONFIGが開いている場合は反応させない
    const configModal =
      document.getElementById('config-modal-overlay');

    if (
      configModal &&
      configModal.classList.contains('active')
    ) {
      return;
    }

    // 会話画面が存在しない場合は反応させない
    const dialogueBox =
      document.getElementById('dialogue-box');

    if (!dialogueBox) {
      return;
    }

    // 会話枠が非表示なら反応させない
    if (
      dialogueBox.classList.contains('hidden')
    ) {
      return;
    }

    // AUTO中なら解除
    if (isAutoMode) {
      stopAutoMode();
    }

    // SKIP中なら解除
    if (isSkipMode) {
      stopSkipMode();
    }

    nextDialogue();
  }
);


  }


  // =========================================================
  // 起動
  // =========================================================

  window.addEventListener(
  'DOMContentLoaded',
  () => {

    resizeGameScreen();

    initUIEvents();


    // 保存された速度をスライダーにも反映
    const speedSlider =
      document.getElementById(
        'text-speed-slider'
      );

    if (speedSlider) {
      speedSlider.value =
        String(textSpeed);
    }


    updateSpeedDisplay(
      textSpeed
    );


    showTitleScreen();

  }
);


   window.addEventListener(
  'resize',
  resizeGameScreen
);

</script>
